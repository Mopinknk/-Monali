<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบบันทึกรายรับ-รายจ่าย</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fbfcff;--card:#fff;--line:#eef0f7;--text:#4a3f44;--mute:#9a8c92;--dark:#3b2f35;--rose:#d9617f;--rose2:#c24d6c;--soft:#e6f3ff;--inc:#2f86c6;--exp:#d9567a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Sarabun','Noto Sans Thai',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px 420px at 100% 0,#ffe3ec 0,transparent 70%),radial-gradient(400px 400px at 0 100%,#dff0ff 0,transparent 70%),radial-gradient(300px 300px at 85% 95%,#e8f4ff 0,transparent 70%)}
.side{position:fixed;left:14px;top:14px;bottom:14px;width:226px;background:var(--card);border-radius:24px;box-shadow:0 4px 24px rgba(90,110,150,.08);padding:28px 14px;z-index:20;overflow-y:auto}
.brand{font-family:'Prompt','Sarabun',sans-serif;font-weight:500;font-size:15px;color:var(--dark);padding:0 12px 24px;line-height:1.35}
.brand{cursor:pointer}.brand .lg{display:block;width:46px;height:46px;border-radius:14px;object-fit:cover;margin-bottom:12px;background:linear-gradient(135deg,#ffb8cf,#a9d6ff)}.side .set{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.brand small{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px;font-family:'Sarabun',sans-serif}
.nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;margin-bottom:4px;border-radius:14px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;transition:all .15s}
.nav button:hover{background:#f3f9ff}
.nav button.on{background:var(--soft);color:#2a78b8;font-weight:600}
.top{display:none;position:sticky;top:0;z-index:15;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 18px;align-items:center;justify-content:space-between}
.top b{font-size:14px;font-weight:600}
main{margin-left:254px;padding:36px 40px 80px;max-width:1160px;position:relative}
h1{font-family:'Prompt','Sarabun',sans-serif;font-size:24px;font-weight:500;margin:0 0 4px;color:var(--dark)}
.sub{color:var(--mute);margin:0 0 26px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.card{border:0;border-radius:22px;padding:20px 22px;background:#fff;box-shadow:0 4px 20px rgba(90,110,150,.07)}
.grid .card:nth-child(1){background:#e3f2ff}
.grid .card:nth-child(2){background:#ffe8ef}
.grid .card:nth-child(3){background:#d9ecfb}
.grid .card:nth-child(4){background:#ffdde8}
.card .l{color:#7d6f76;font-size:13px}
.card .v{font-family:'Prompt','Sarabun',sans-serif;font-size:26px;font-weight:500;margin-top:6px;color:var(--dark)}
.card .n{font-size:12px;color:#8a7c83;margin-top:4px}
.inc{color:var(--inc)!important}.exp{color:var(--exp)!important}
.box{background:var(--card);border-radius:24px;padding:24px 26px;margin-bottom:24px;box-shadow:0 4px 24px rgba(90,110,150,.07)}
.box h2{font-family:'Prompt','Sarabun',sans-serif;font-size:16px;font-weight:500;margin:0 0 16px;color:var(--dark)}
main>.row{background:var(--card);border-radius:22px;padding:16px 20px;box-shadow:0 4px 20px rgba(90,110,150,.07);margin-bottom:20px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:18px}
.f{display:flex;flex-direction:column;gap:5px;min-width:150px}
.f label{font-size:12px;color:var(--mute);padding-left:4px}
input,select,textarea{font:inherit;font-size:14px;padding:10px 14px;border:1px solid #e6ecf6;border-radius:14px;background:#fafcff;color:var(--text);width:100%;transition:all .15s}
input[type=file]{padding:8px 10px;font-size:13px}
input:focus,select:focus,textarea:focus{outline:0;border-color:#8ec5f0;box-shadow:0 0 0 4px #e3f2ff}
textarea{resize:vertical;min-height:70px}
.btn{font:inherit;font-size:14px;border:1px solid var(--rose);background:var(--rose);color:#fff;padding:9px 22px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn:hover{background:var(--rose2);border-color:var(--rose2);transform:translateY(-1px)}
.btn.o{background:#fff;color:#2a78b8;border-color:#cfe5f8}
.btn.o:hover{background:var(--soft);border-color:#8ec5f0}
.btn.d{background:#fff;color:var(--exp);border-color:#f8d3df}
.btn.d:hover{background:#fff0f4}
.btn.s{padding:4px 14px;font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f6faff}
th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:#f8fbff}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;font-size:12px;background:#eef1f7;color:var(--mute)}
.tag.i{background:#e0f0fd;color:var(--inc)}
.tag.e{background:#ffe6ee;color:var(--exp)}
.empty{text-align:center;color:var(--mute);padding:36px 0}
.thumb{width:38px;height:38px;object-fit:cover;border-radius:10px;cursor:pointer;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.ov{position:fixed;inset:0;background:rgba(74,63,68,.28);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.md{background:#fff;border-radius:26px;box-shadow:0 16px 48px rgba(80,50,60,.18);padding:28px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.md h3{font-family:'Prompt','Sarabun',sans-serif;margin:0 0 18px;font-size:17px;font-weight:500}
.md .f{margin-bottom:14px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 22px;border-radius:99px;z-index:60;display:none;max-width:90vw;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.prev{margin-top:8px}
.prev img{max-width:160px;max-height:160px;border-radius:14px;display:block;margin-bottom:6px}
#hsum{color:var(--mute);font-size:13px;background:#f6faff;border-radius:12px;padding:8px 14px;display:inline-block}
#hsum b{color:var(--dark);font-weight:600}
@media(max-width:900px){
.side{left:0;top:0;bottom:0;border-radius:0 24px 24px 0;transform:translateX(-105%);transition:.2s}
.side.open{transform:none;box-shadow:0 0 40px rgba(80,50,60,.2)}
.top{display:flex}
main{margin-left:0;padding:20px 14px 60px}
.box{padding:18px 16px;border-radius:20px}
.two{grid-template-columns:1fr}
.f{min-width:100%}
.row .btn{width:100%}
}

.lg-wrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:radial-gradient(420px 420px at 100% 0,#ffe3ec 0,transparent 70%),radial-gradient(400px 400px at 0 100%,#dff0ff 0,transparent 70%),#fbfcff}
.lg-card{width:100%;max-width:380px;background:#fff;border-radius:26px;padding:32px;box-shadow:0 8px 40px rgba(90,110,150,.14)}
.lg-logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#ffb8cf,#a9d6ff);margin-bottom:14px}
.lg-card .f{margin-bottom:14px}
.lerr{color:var(--exp);min-height:20px;font-size:13px;margin:4px 0 10px}
.need{border-color:var(--rose)!important;box-shadow:0 0 0 4px #ffe3ec!important}
#scanMsg{font-size:14px;color:var(--mute);line-height:1.8}
#scanMsg .btn{margin:0 4px 4px 0}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand" id="brand" onclick="shopForm()"></div>
  <nav class="nav" id="nav"></nav>
  <div class="nav set"><button onclick="shopForm()">ตั้งค่าร้าน</button><button onclick="logout()">ออกจากระบบ</button></div>
</aside>
<div class="top"><b id="topTitle">Dashboard ภาพรวม</b><button class="btn o s" onclick="toggleSide()">เมนู</button></div>
<main id="main"></main>
<div id="login" class="lg-wrap"><div class="lg-card"><div class="lg-logo"></div><h1 style="font-size:22px">เข้าสู่ระบบ</h1><p class="sub" style="margin-bottom:20px">สำหรับผู้ดูแลระบบ</p><div class="f"><label>อีเมล</label><input id="le" type="email" autocomplete="username"></div><div class="f"><label>รหัสผ่าน</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div><p id="lerr" class="lerr"></p><button id="lb" class="btn" style="width:100%" onclick="doLogin()">เข้าสู่ระบบ</button></div></div>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ---------- ค่าคงที่ ---------- */
var KEY='ie_tracker_cache_v2';
var CH={chat:'ขายผ่านแชท',web:'ขายผ่านเว็บไซต์'};
var EXPC=['ค่าสมัครสมาชิกแอปพรีเมี่ยม','ค่าบัญชีและค่าบริการ','ค่าโฆษณาและการตลาด','ค่าธรรมเนียมธุรกรรม','ค่าใช้จ่ายอื่น ๆ'];
var INCC=['รายได้จากการขายแอปพรีเมี่ยม','รายรับอื่น ๆ'];
var MENU=[['dash','Dashboard ภาพรวม'],['chat','ระบบขายผ่านแชท'],['web','ระบบขายผ่านเว็บไซต์'],['form','บันทึกรายรับ-รายจ่าย'],['hist','ประวัติรายการ'],['cats','จัดการหมวดหมู่'],['exp','ส่งออกเอกสาร']];

/* ---------- ตัวช่วย ---------- */
function uid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)})}
function today(){return new Date().toLocaleDateString('sv-SE')}
function iso(back){var d=new Date();d.setDate(d.getDate()-back);return d.toLocaleDateString('sv-SE')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dth(s){if(!s)return '-';var p=s.split('-');return p[2]+'/'+p[1]+'/'+(+p[0]+543)}
function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},2600)}

/* ---------- ข้อมูล ---------- */
var S;
var SB={url:'https://vwgysbjieksxkramurfp.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3Z3lzYmppZWtzeGtyYW11cmZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MDIwNzMsImV4cCI6MjExMDM3ODA3M30.c5WRrjgYDYXW7TvsAG-_gW-DKXuMOBf6zSbWs69HxgI',owner:'fadf6bf6-37d3-45f8-b5ba-7ed0733d1de9'};
var DEF_INC=INCC.slice(),DEF_EXP=EXPC.slice();
function applyCats(){var c=S&&S.cats;INCC=(c&&c.inc&&c.inc.length)?c.inc.slice():DEF_INC.slice();EXPC=(c&&c.exp&&c.exp.length)?c.exp.slice():DEF_EXP.slice()}
function allCats(){var a=INCC.concat(EXPC);S.tx.forEach(function(t){if(t.cat&&a.indexOf(t.cat)<0)a.push(t.cat)});return a}
function fixS(){if(!S.shop)S.shop={name:'',logo:''};applyCats()}
function cache(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fail(e){if(e&&e.message==='NOAUTH')return;console.error(e);var m=String((e&&e.message)||'').slice(0,160);toast('ดำเนินการไม่สำเร็จ'+(m?' : '+m:' ตรวจสอบอินเทอร์เน็ตและการตั้งค่า Supabase'))}
var SES=null,SESKEY='ie_session_v1';
function loadSes(){try{SES=JSON.parse(localStorage.getItem(SESKEY)||'null')}catch(e){SES=null}}
function saveSes(d){SES={access_token:d.access_token,refresh_token:d.refresh_token,exp:Math.floor(Date.now()/1000)+(d.expires_in||3600)};try{localStorage.setItem(SESKEY,JSON.stringify(SES))}catch(e){}}
function auth(path,body){
  return fetch(SB.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){
    return r.json().then(function(j){if(!r.ok)throw new Error(j.error_description||j.msg||j.message||String(r.status));return j});
  });
}
function token(){
  if(!SES)return Promise.reject(new Error('NOAUTH'));
  if(SES.exp-Math.floor(Date.now()/1000)>60)return Promise.resolve(SES.access_token);
  return auth('token?grant_type=refresh_token',{refresh_token:SES.refresh_token}).then(function(d){saveSes(d);return SES.access_token}).catch(function(){logout(true);throw new Error('NOAUTH')});
}
function api(method,path,body,hdr){
  return token().then(function(t){
    var h={apikey:SB.key,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'return=minimal'};
    if(hdr)for(var k in hdr)h[k]=hdr[k];
    return fetch(SB.url+'/rest/v1/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
  }).then(function(r){
    if(r.status===401){logout(true);throw new Error('NOAUTH')}
    if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t)});
    return r.text().then(function(t){return t?JSON.parse(t):null});
  });
}
function showLogin(msg){$('login').style.display='flex';$('lerr').textContent=msg||'';setTimeout(function(){$('le').focus()},50)}
function doLogin(){
  var em=$('le').value.trim(),pw=$('lp').value;
  if(!em||!pw){$('lerr').textContent='กรุณากรอกอีเมลและรหัสผ่าน';return}
  $('lb').disabled=true;$('lerr').textContent='';
  auth('token?grant_type=password',{email:em,password:pw}).then(function(d){
    if(!d.user||d.user.id!==SB.owner)throw new Error('บัญชีนี้ไม่มีสิทธิ์เข้าใช้งาน');
    saveSes(d);$('login').style.display='none';$('lp').value='';startApp();
  }).catch(function(e){$('lerr').textContent=e.message==='Invalid login credentials'?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':e.message}).then(function(){$('lb').disabled=false});
}
function logout(silent){
  SES=null;try{localStorage.removeItem(SESKEY);localStorage.removeItem(KEY)}catch(e){}
  S={shop:{name:'',logo:''},acc:[],tx:[]};
  $('side').classList.remove('open');closeM();
  showLogin(silent===true?'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่':'');
}
function getAll(path){
  var out=[];
  function pg(o){return api('GET',path+'&limit=1000&offset='+o).then(function(r){r=r||[];out=out.concat(r);return r.length===1000?pg(o+1000):out})}
  return pg(0);
}
function fromAcc(r){return{id:r.id,ch:r.channel,name:r.name,open:Number(r.opening_balance)}}
function fromTx(r){return{id:r.id,date:r.tx_date,type:r.type,name:r.name,cat:r.category,amt:Number(r.amount),note:r.note||'',ch:r.channel,acc:r.account_id,hasImg:!!r.has_image}}
function pull(){
  return Promise.all([
    api('GET','shop_settings?select=name,logo'),
    getAll('accounts?select=*&order=created_at.asc,id.asc'),
    getAll('transactions?select=id,tx_date,type,name,category,amount,note,channel,account_id,has_image&order=tx_date.desc,created_at.desc,id.asc'),
    api('GET','shop_settings?select=categories').catch(function(){return null})
  ]).then(function(r){
    var sh=(r[0]&&r[0][0])||{};
    var cc=r[3]&&r[3][0]&&r[3][0].categories;
    S={shop:{name:sh.name||'',logo:sh.logo||''},acc:r[1].map(fromAcc),tx:r[2].map(fromTx),cats:cc||(S&&S.cats)||null};
    applyCats();cache();
  });
}
function init(){try{localStorage.removeItem('ie_tracker_v1')}catch(e){}loadSes();if(!SES){showLogin();return}startApp()}
function startApp(){
  S={shop:{name:'',logo:''},acc:[],tx:[]};
  try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);fixS()}}catch(e){}
  view='dash';render();
  pull().then(function(){if(view!=='form'&&!$('modalRoot').innerHTML)render();else drawBrand()}).catch(function(e){if(e&&e.message==='NOAUTH')return;console.error(e);toast('เชื่อมต่อ Supabase ไม่สำเร็จ กำลังแสดงข้อมูลที่เก็บไว้ในเครื่อง')});
}
function sum(list){var i=0,e=0;list.forEach(function(t){if(t.type==='inc')i+=+t.amt;else e+=+t.amt});return{inc:i,exp:e,net:i-e}}
function accBal(a){var s=sum(S.tx.filter(function(t){return t.acc===a.id}));return{inc:s.inc,exp:s.exp,bal:(+a.open||0)+s.net}}
function chBal(ch){return S.acc.filter(function(a){return a.ch===ch}).reduce(function(x,a){return x+accBal(a).bal},0)}
function accName(id){var a=S.acc.find(function(x){return x.id===id});return a?a.name:'-'}
function inPeriod(t,p,v){return p==='all'||!v||t.date.indexOf(v)===0}

/* ---------- สถานะหน้า ---------- */
var view='dash',editId=null,preset='chat',formImg='',imgTouched=false;
var D={scope:'all',p:'month',v:today().slice(0,7)};
var H={q:'',from:'',to:'',type:'',cat:'',ch:''};
var E={ch:'all',from:'',to:''};

function toggleSide(){$('side').classList.toggle('open')}
function go(v,id,ch){view=v;if(v==='form'){editId=id||null;if(ch)preset=ch;formImg='';imgTouched=false;if(id){var t=S.tx.find(function(x){return x.id===id});if(t&&t.hasImg){api('GET','transactions?id=eq.'+id+'&select=image').then(function(r){if(editId===id&&r&&r[0]){return resolveImg(r[0].image||'').then(function(im){if(editId===id){formImg=im;if(view==='form'&&$('prev'))showPrev()}})}}).catch(function(){})}}}
  $('side').classList.remove('open');render();window.scrollTo(0,0)}
function drawBrand(){
  var sh=S.shop;
  $('brand').innerHTML=(sh.logo?'<img class="lg" src="'+sh.logo+'">':'<div class="lg"></div>')+esc(sh.name||'ระบบรายรับ-รายจ่าย')+'<small>'+(sh.name?'ระบบรายรับ-รายจ่าย':'ธุรกิจขายแอปพรีเมี่ยม')+'</small>';
  document.title=sh.name||'ระบบบันทึกรายรับ-รายจ่าย';
}
var tmpLogo='';
function shopForm(){
  tmpLogo=S.shop.logo||'';
  $('side').classList.remove('open');
  modal('<h3>ตั้งค่าร้าน</h3><div class="f"><label>ชื่อร้าน</label><input id="sn" value="'+esc(S.shop.name)+'" placeholder="เช่น ร้านแอปพรีเมี่ยม"></div><div class="f"><label>โลโก้ร้าน (เลือกจากเครื่อง)</label><input id="sl" type="file" accept="image/*" onchange="pickLogo(this)"><div class="prev" id="lprev"></div></div><div class="f"><label>ที่เก็บรูป</label><button class="btn o s" type="button" onclick="migrateImgs()">ย้ายรูปเดิมไปที่เก็บใหม่ (Storage)</button><div id="migmsg" style="font-size:12px;color:var(--mute);margin-top:6px"></div></div><div class="acts"><button class="btn o" onclick="closeM()">ยกเลิก</button><button class="btn" onclick="saveShop()">บันทึก</button></div>');
  showLogo();setTimeout(function(){$('sn').focus()},50);
}
function showLogo(){
  $('lprev').innerHTML=tmpLogo?'<img src="'+tmpLogo+'" style="max-width:120px;max-height:120px"><span style="font-size:12px;color:var(--mute)">ขนาดหลังบีบอัด ~'+Math.round(tmpLogo.length*0.75/1024)+' KB</span> <button class="btn d s" type="button" onclick="tmpLogo=\'\';$(\'sl\').value=\'\';showLogo()">ลบโลโก้</button>':'';
}
function pickLogo(inp){

  if(f.type.indexOf('image/')!==0){toast('กรุณาเลือกไฟล์รูปภาพ');inp.value='';return}
  var r=new FileReader();
  r.onload=function(e){
    var im=new Image();
    im.onload=function(){
      var k=Math.min(1,256/Math.max(im.width,im.height));
      var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);

    im.onerror=function(){toast('เปิดรูปภาพไม่ได้')};
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}

function catList(t){return t==='inc'?INCC:EXPC}
function rCats(){
  function box(t,title){

function addCat(t){
  var el=$('nc_'+t),v=el.value.trim();
  if(!v){toast('กรุณากรอกชื่อหมวดหมู่');return}
  if(INCC.concat(EXPC).indexOf(v)>=0){toast('มีหมวดหมู่ชื่อนี้อยู่แล้ว');return}
  catList(t).push(v);
  saveCats().then(function(){toast('เพิ่มหมวดหมู่แล้ว');rCats()}).catch(function(e){catList(t).pop();S.cats={inc:INCC.slice(),exp:EXPC.slice()};catErr(e);rCats()});
}
var renCtx=null;
function renCat(t,i){
  renCtx={t:t,i:i};
  modal('<h3>แก้ไขชื่อหมวดหมู่</h3><div class="f"><label>ชื่อหมวดหมู่</label><input id="rc" value="'+esc(catList(t)[i])+'" onkeydown="if(event.key===\'Enter\')doRenCat()"></div><div class="acts"><button class="btn o" onclick="closeM()">ยกเลิก</button><button class="btn" onclick="doRenCat()">บันทึก</button></div>');
  setTimeout(function(){$('rc').focus()},50);
}
function doRenCat(){
  var t=renCtx.t,i=renCtx.i,L=catList(t),old=L[i],v=$('rc').value.trim();
  if(!v){toast('กรุณากรอกชื่อหมวดหมู่');return}
  if(v===old){closeM();return}
  if(INCC.concat(EXPC).indexOf(v)>=0){toast('มีหมวดหมู่ชื่อนี้อยู่แล้ว');return}
  L[i]=v;
  var used=S.tx.some(function(x){return x.type===t&&x.cat===old});
  saveCats().then(function(){
    if(!used)return;
    return api('PATCH','transactions?type=eq.'+t+'&category=eq.'+encodeURIComponent(old),{category:v}).then(function(){S.tx.forEach(function(x){if(x.type===t&&x.cat===old)x.cat=v})});
  }).then(function(){cache();closeM();toast('แก้ไขหมวดหมู่แล้ว');rCats()}).catch(function(e){L[i]=old;S.cats={inc:INCC.slice(),exp:EXPC.slice()};closeM();catErr(e)});
}
function delCat(t,i){
  var L=catList(t),c=L[i];
  if(L.length<2){toast('ต้องมีหมวดหมู่อย่างน้อย 1 รายการ');return}
  var n=S.tx.filter(function(x){return x.type===t&&x.cat===c}).length;
  confirmBox('ลบหมวดหมู่ “'+esc(c)+'” ?'+(n?'<br>มี '+n+' รายการที่ใช้หมวดหมู่นี้ รายการเดิมจะยังคงอยู่และยังแสดงชื่อหมวดหมู่เดิม':''),function(){
    L.splice(i,1);
    saveCats().then(function(){toast('ลบหมวดหมู่แล้ว');rCats()}).catch(function(e){L.splice(i,0,c);S.cats={inc:INCC.slice(),exp:EXPC.slice()};catErr(e);rCats()});
  });
}


/* ---------- ที่เก็บรูป (Supabase Storage, bucket: slips) ---------- */
function stHdr(t,extra){var h={apikey:SB.key,Authorization:'Bearer '+t};if(extra)for(var k in extra)h[k]=extra[k];return h}
function stCheck(r){if(r.status===401){logout(true);throw new Error('NOAUTH')}if(!r.ok)return r.text().then(function(t){throw new Error('storage '+r.status+' '+t)});return r}
function stUpload(path,dataUrl){
  return Promise.all([token(),fetch(dataUrl).then(function(r){return r.blob()})]).then(function(a){
    return fetch(SB.url+'/storage/v1/object/slips/'+path,{method:'POST',headers:stHdr(a[0],{'Content-Type':'image/jpeg','x-upsert':'true'}),body:a[1]});
  }).then(stCheck).then(function(){return path});
}
function stDelete(path){return token().then(function(t){return fetch(SB.url+'/storage/v1/object/slips/'+path,{method:'DELETE',headers:stHdr(t)})}).catch(function(){})}
function blobToDataUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}
/* ค่าในคอลัมน์ image: data:... = รูปเก่าในฐานข้อมูล, อย่างอื่น = path ใน Storage */
function resolveImg(v){
  if(!v)return Promise.resolve('');
  if(v.indexOf('data:')===0)return Promise.resolve(v);
  return token().then(function(t){return fetch(SB.url+'/storage/v1/object/authenticated/slips/'+v,{headers:stHdr(t)})}).then(stCheck).then(function(r){return r.blob()}).then(blobToDataUrl);
}
var migRun=false;
function migrateImgs(){
  if(migRun)return;migRun=true;
  var done=0,fails=0;
  function msg(m){var el=$('migmsg');if(el)el.textContent=m}
  function step(){
    api('GET','transactions?select=id&image=like.data:*&limit=10').then(function(rows){
      rows=rows||[];
      if(!rows.length){migRun=false;msg('ย้ายเสร็จแล้ว '+done+' รูป'+(fails?' (ไม่สำเร็จ '+fails+')':''));return}
      return Promise.all(rows.map(function(r){
        return api('GET','transactions?id=eq.'+r.id+'&select=image').then(function(x){
          var img=x&&x[0]&&x[0].image;if(!img||img.indexOf('data:')!==0)return;
          var path=r.id+'.jpg';
          return stUpload(path,img).then(function(){return api('PATCH','transactions?id=eq.'+r.id,{image:path})}).then(function(){done++});
        }).catch(function(e){fails++;console.error(e)});
      })).then(function(){
        msg('กำลังย้ายรูป... สำเร็จ '+done+' รูป'+(fails?' (ไม่สำเร็จ '+fails+')':''));
        if(fails>0&&done===0){migRun=false;msg('ย้ายไม่สำเร็จ ตรวจสอบว่ารันคำสั่ง SQL สร้างที่เก็บรูปแล้ว');return}
        if(fails>=10){migRun=false;msg('หยุดย้ายเพราะมีรูปที่ย้ายไม่สำเร็จ '+fails+' รูป (สำเร็จ '+done+')');return}
        step();
      });
    }).catch(function(e){migRun=false;msg('ผิดพลาด: '+String((e&&e.message)||e).slice(0,160))});
  }
  msg('เริ่มย้ายรูป...');step();
}

var SCANBOX='<div class="box" style="max-width:720px"><h2>สแกนสลิป</h2><div class="f" style="max-width:360px;margin-bottom:12px"><label>เลือกรูปสลิปจากเครื่อง</label><input id="fs" type="file" accept="image/*" onchange="scanSlip(this)"></div><div id="scanMsg">ระบบจะอ่านยอดเงิน วันที่ และโน้ตจากสลิป แล้วใส่ลงฟอร์มให้ โน้ตในสลิปจะกลายเป็นชื่อรายการ ถ้าสลิปไม่มีโน้ตให้กรอกเอง และตรวจสอบข้อมูลก่อนบันทึกทุกครั้ง</div></div>';
var tessP=null;
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  if(tessP)return tessP;
  tessP=new Promise(function(res,rej){
    var sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js';
    sc.onload=res;sc.onerror=function(){tessP=null;rej(new Error('LOAD'))};
    document.head.appendChild(sc);
  });
  return tessP;
}
function say(t){var m=$('scanMsg');if(m)m.textContent=t}
function useAmt(v){if($('fm'))$('fm').value=v}
function parseSlip(t){
  var lines=t.split(/\n+/).map(function(x){return x.replace(/\s+/g,' ').trim()}).filter(Boolean);
  var out={amount:0,alts:[],date:'',memo:''};
  /* ยอดเงิน */
  var numRe=/(?<![\d.,])(\d{1,3}(?:,\d{3})+|\d+)\.\d{2}(?![\d.])/g;
  var kw=/จำนวน|amount|ยอด|บาท|thb/i,fee=/ค่าธรรมเนียม|fee/i,c=[];
  lines.forEach(function(l,i){
    var prev=i>0?lines[i-1]:'',m;numRe.lastIndex=0;
    while((m=numRe.exec(l))){
      var v=parseFloat(m[0].replace(/,/g,''));
      if(v>0)c.push({v:v,k:kw.test(l)||(kw.test(prev)&&!/\d+\.\d{2}/.test(prev)),f:fee.test(l)||(fee.test(prev)&&!/\d/.test(prev))});
    }
  });
  var pool=c.filter(function(x){return!x.f});
  var pick=pool.filter(function(x){return x.k})[0];
  if(!pick&&pool.length)pick=pool.reduce(function(a,b){return b.v>a.v?b:a});
  if(pick)out.amount=pick.v;
  pool.forEach(function(x){if(x.v!==out.amount&&out.alts.indexOf(x.v)<0)out.alts.push(x.v)});
  out.alts=out.alts.slice(0,4);
  /* วันที่ */
  var thm={'มค':1,'กพ':2,'มีค':3,'เมย':4,'พค':5,'มิย':6,'กค':7,'สค':8,'กย':9,'ตค':10,'พย':11,'ธค':12};
  var enm=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  var limit=iso(-1),full=lines.join('\n'),m;
  function mk(d,mo,y){d=+d;if(!mo||d<1||d>31||y<2000)return '';var r=y+'-'+(mo<10?'0':'')+mo+'-'+(d<10?'0':'')+d;return r<=limit?r:''}
  var re1=/(\d{1,2})\s*([ก-๙.]{2,8}|[A-Za-z]{3,9}\.?)\s*(\d{2,4})/g;
  while(!out.date&&(m=re1.exec(full))){
    var tk=m[2].replace(/\./g,''),th=/[ก-๙]/.test(tk),mo=th?thm[tk]:enm.indexOf(tk.slice(0,3).toLowerCase())+1,n=parseInt(m[3],10);
    var y=n>=2400?n-543:(n<100?(th?2500+n-543:2000+n):n);
    out.date=mk(m[1],mo,y);
  }
  var re2=/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/g;
  while(!out.date&&(m=re2.exec(full))){
    var n2=parseInt(m[3],10),y2=n2>=2400?n2-543:(n2<100?(n2>=57?2500+n2-543:2000+n2):n2);
    out.date=mk(m[1],parseInt(m[2],10),y2);
  }
  /* โน้ต / บันทึกช่วยจำ */
  var lab=/(บันทึกช่วยจำ|บันทึก|ข้อความ|memo|note|หมายเหตุ|โน้ต)\s*[:：]?\s*(.*)$/i;
  var stop=/จาก|ไปยัง|ถึง|from|จำนวน|ค่าธรรมเนียม|fee|amount|รหัส|เลขที่|ref|บาท|\d{1,2}:\d{2}/i;
  for(var i=0;i<lines.length;i++){
    var mm=lab.exec(lines[i]);
    if(mm){
      var v2=(mm[2]||'').trim();
      if(!v2&&i+1<lines.length&&!stop.test(lines[i+1]))v2=lines[i+1];
      v2=v2.replace(/^[:：\-\s]+/,'').slice(0,80);
      if(v2){out.memo=v2;break}
    }
  }
  return out;
}
function applySlip(p){
  if(!$('fm'))return;
  var got=[],h='';
  if(p.amount){$('fm').value=p.amount;got.push('ยอดเงิน '+money(p.amount)+' บาท')}
  if(p.date){$('fd').value=p.date;got.push('วันที่ '+dth(p.date))}
  if(p.memo){$('fn').value=p.memo;got.push('โน้ต "'+p.memo+'"')}
  h+=got.length?'<b style="color:var(--dark)">อ่านได้:</b> '+esc(got.join(' | '))+'<br>':'อ่านข้อมูลจากสลิปไม่ได้<br>';
  if(!p.amount)h+='<span class="exp">ไม่พบยอดเงิน กรุณากรอกเอง</span><br>';
  if(!p.memo)h+='<span class="exp">สลิปนี้ไม่มีโน้ต กรุณากรอกชื่อรายการเอง</span><br>';
  if(p.alts.length)h+='ตัวเลขอื่นที่พบ (กดเพื่อใช้แทนยอดเงิน): '+p.alts.map(function(v){return '<button class="btn o s" type="button" onclick="useAmt('+v+')">'+money(v)+'</button>'}).join('')+'<br>';
  h+='แนบรูปสลิปไว้แล้ว กรุณาตรวจสอบข้อมูลก่อนบันทึก และเลือกประเภท ช่องทาง บัญชี หมวดหมู่เอง';
  $('scanMsg').innerHTML=h;
  var fn=$('fn');
  if(!p.memo){fn.classList.add('need');fn.addEventListener('input',function(){fn.classList.remove('need')},{once:true});fn.focus()}
  else if(!p.amount)$('fm').focus();
}
function scanSlip(inp){
  var f=inp.files[0];if(!f)return;
  if(f.type.indexOf('image/')!==0){say('กรุณาเลือกไฟล์รูปภาพ');inp.value='';return}
  say('กำลังเตรียมรูป...');inp.disabled=true;
  var r=new FileReader();
  r.onerror=function(){say('อ่านไฟล์ไม่ได้');inp.disabled=false};
  r.onload=function(e){
    var im=new Image();
    im.onerror=function(){say('เปิดรูปภาพไม่ได้');inp.disabled=false};
    im.onload=function(){
      var k=Math.min(1,800/Math.max(im.width,im.height));
      var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      formImg=c.toDataURL('image/jpeg',0.7);imgTouched=true;if($('prev'))showPrev();
      var mx=Math.max(im.width,im.height),k2=mx<1400?1400/mx:Math.min(1,2000/mx);
      var o=document.createElement('canvas');o.width=Math.round(im.width*k2);o.height=Math.round(im.height*k2);
      var y=o.getContext('2d');y.fillStyle='#fff';y.fillRect(0,0,o.width,o.height);y.filter='grayscale(1) contrast(1.35)';y.drawImage(im,0,0,o.width,o.height);
      var worker;
      say('กำลังโหลดตัวอ่านสลิป (ครั้งแรกอาจใช้เวลาสักครู่ ต้องเชื่อมต่ออินเทอร์เน็ต)...');
      loadTess().then(function(){
        return Tesseract.createWorker('tha+eng',1,{logger:function(m){if(m.status==='recognizing text')say('กำลังอ่านสลิป '+Math.round(m.progress*100)+'%')}});
      }).then(function(w){worker=w;return w.recognize(o)})
      .then(function(res){return worker.terminate().then(function(){return res})})
      .then(function(res){applySlip(parseSlip(res.data.text||''))})
      .catch(function(err){
        console.error(err);
        say((err&&err.message==='LOAD'?'โหลดตัวอ่านสลิปไม่สำเร็จ ต้องเชื่อมต่ออินเทอร์เน็ต':'อ่านสลิปไม่สำเร็จ')+' กรุณากรอกข้อมูลเอง (แนบรูปสลิปไว้แล้ว)');
      }).then(function(){inp.disabled=false;inp.value=''});
    };
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}

}
function expInfo(){
  var chn=E.ch==='all'?'ภาพรวมทั้งสองระบบ':'ระบบ'+CH[E.ch];
  var per=(E.from||E.to)?(E.from?dth(E.from):'เริ่มต้น')+' - '+(E.to?dth(E.to):'ปัจจุบัน'):'ทุกช่วงเวลา';
  return{chn:chn,per:per,now:dth(today())};
}
function drawExp(){
  var L=expRows(),s=sum(L);
  $('epv').innerHTML='จะส่งออก <b>'+L.length+'</b> รายการ | รายรับ <b class="inc">'+money(s.inc)+'</b> | รายจ่าย <b class="exp">'+money(s.exp)+'</b> | สุทธิ <b>'+money(s.net)+'</b>';
}
function rExp(){
  $('main').innerHTML='<h1>ส่งออกเอกสาร</h1><p class="sub">ส่งออกข้อมูลเป็นไฟล์ PDF หรือ Excel ตามช่องทางและช่วงเวลาที่เลือก</p>'+
  '<div class="box" style="max-width:760px"><div class="row">'+
  '<div class="f"><label>ช่องทางที่ต้องการส่งออก</label><select onchange="setE(\'ch\',this.value)"><option value="all"'+(E.ch==='all'?' selected':'')+'>ภาพรวมทั้งสองระบบ</option><option value="chat"'+(E.ch==='chat'?' selected':'')+'>เฉพาะขายผ่านแชท</option><option value="web"'+(E.ch==='web'?' selected':'')+'>เฉพาะขายผ่านเว็บไซต์</option></select></div>'+
  '<div class="f"><label>ตั้งแต่วันที่</label><input type="date" value="'+E.from+'" onchange="setE(\'from\',this.value)"></div>'+
  '<div class="f"><label>ถึงวันที่</label><input type="date" value="'+E.to+'" onchange="setE(\'to\',this.value)"></div></div>'+
  '<p id="epv"></p><div class="acts" style="justify-content:flex-start"><button class="btn" onclick="expPDF()">ส่งออก PDF</button><button class="btn o" onclick="expXLS()">ส่งออก Excel</button></div>'+
  '<p class="sub" style="margin:14px 0 0;font-size:13px">การส่งออก PDF จะเปิดหน้าต่างพิมพ์ ให้เลือก "บันทึกเป็น PDF" ที่ปลายทาง</p></div>';
  drawExp();
}
function groupSum(L){
  var o=[];
  ['chat','web'].forEach(function(c){var x=sum(L.filter(function(t){return t.ch===c}));if(E.ch==='all'||E.ch===c)o.push([CH[c],x.inc,x.exp,x.net])});
  return o;
}
function expPDF(){
  var L=expRows();if(!L.length){toast('ไม่มีรายการให้ส่งออกในตัวกรองที่เลือก');return}
  var s=sum(L),i=expInfo();
  var gs=groupSum(L).map(function(g){return '<tr><td>'+g[0]+'</td><td class="r">'+money(g[1])+'</td><td class="r">'+money(g[2])+'</td><td class="r">'+money(g[3])+'</td></tr>'}).join('');
  var rows=L.map(function(t,n){return '<tr><td>'+(n+1)+'</td><td>'+dth(t.date)+'</td><td>'+esc(t.name)+'</td><td>'+esc(t.cat)+'</td><td>'+(t.type==='inc'?'รายรับ':'รายจ่าย')+'</td><td class="r">'+money(t.amt)+'</td><td>'+CH[t.ch]+'<br>'+esc(accName(t.acc))+'</td><td>'+esc(t.note)+'</td></tr>'}).join('');
  var h='<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>รายงานรายรับ-รายจ่าย</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet"><style>body{font-family:Sarabun,Tahoma,sans-serif;color:#111;font-size:12px;margin:24px}h1{font-size:20px;margin:0 0 4px}p{margin:2px 0;color:#444}table{width:100%;border-collapse:collapse;margin:14px 0}th,td{border:1px solid #ccc;padding:5px 7px;text-align:left;vertical-align:top}th{background:#f1f1f1}.r{text-align:right}h2{font-size:14px;margin:18px 0 0}.t td{font-weight:600;background:#fafafa}@page{margin:14mm}</style></head><body>'+
  '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">'+(S.shop.logo?'<img src="'+S.shop.logo+'" style="height:52px">':'')+'<div>'+(S.shop.name?'<b style="font-size:16px">'+esc(S.shop.name)+'</b>':'')+'<h1>รายงานรายรับ-รายจ่าย</h1></div></div><p>ขอบเขตข้อมูล: '+i.chn+'</p><p>ช่วงเวลา: '+i.per+'</p><p>วันที่ออกเอกสาร: '+i.now+'</p>'+
  '<h2>สรุปยอด</h2><table><thead><tr><th>รายการสรุป</th><th class="r">รายรับ</th><th class="r">รายจ่าย</th><th class="r">สุทธิ</th></tr></thead><tbody>'+gs+'<tr class="t"><td>รวม</td><td class="r">'+money(s.inc)+'</td><td class="r">'+money(s.exp)+'</td><td class="r">'+money(s.net)+'</td></tr></tbody></table>'+
  '<h2>รายการทั้งหมด ('+L.length+' รายการ)</h2><table><thead><tr><th>#</th><th>วันที่</th><th>รายการ</th><th>หมวดหมู่</th><th>ประเภท</th><th class="r">จำนวนเงิน</th><th>ช่องทาง / บัญชี</th><th>หมายเหตุ</th></tr></thead><tbody>'+rows+'</tbody></table></body></html>';
  var f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  var d=f.contentWindow.document;d.open();d.write(h);d.close();
  setTimeout(function(){f.contentWindow.focus();f.contentWindow.print();setTimeout(function(){f.remove()},3000)},700);
}
function expXLS(){
  var L=expRows();if(!L.length){toast('ไม่มีรายการให้ส่งออกในตัวกรองที่เลือก');return}
  if(typeof XLSX==='undefined'){toast('โหลดไลบรารี Excel ไม่สำเร็จ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่');return}
  var s=sum(L),i=expInfo();
  var a=[[S.shop.name||'ร้าน (ยังไม่ระบุชื่อ)'],['รายงานรายรับ-รายจ่าย'],['ขอบเขตข้อมูล',i.chn],['ช่วงเวลา',i.per],['วันที่ออกเอกสาร',i.now],[],['รายการสรุป','รายรับ','รายจ่าย','สุทธิ']];
  groupSum(L).forEach(function(g){a.push(g)});
  a.push(['รวม',s.inc,s.exp,s.net]);
  var b=[['วันที่','รายการ','หมวดหมู่','ประเภท','จำนวนเงิน','ช่องทาง','บัญชี','หมายเหตุ']];
  L.forEach(function(t){b.push([dth(t.date),t.name,t.cat,t.type==='inc'?'รายรับ':'รายจ่าย',+t.amt,CH[t.ch],accName(t.acc),t.note])});
  var w1=XLSX.utils.aoa_to_sheet(a),w2=XLSX.utils.aoa_to_sheet(b);
  w1['!cols']=[{wch:28},{wch:26},{wch:16},{wch:16}];
  w2['!cols']=[{wch:12},{wch:30},{wch:30},{wch:10},{wch:14},{wch:18},{wch:28},{wch:30}];
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,w1,'สรุปยอด');XLSX.utils.book_append_sheet(wb,w2,'รายการ');
  XLSX.writeFile(wb,'รายรับรายจ่าย_'+(E.ch==='all'?'ภาพรวม':E.ch)+'_'+today()+'.xlsx');
  toast('ส่งออก Excel แล้ว');
}

/* ---------- เริ่มต้น ---------- */
init();
</script>
</body>
</html>
