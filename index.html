<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบบันทึกรายรับ-รายจ่าย</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fbfcff;--card:#fff;--line:#eef0f7;--text:#4a3f44;--mute:#9a8c92;--dark:#3b2f35;--rose:#d9617f;--rose2:#c24d6c;--soft:#e6f3ff;--inc:#2f86c6;--exp:#d9567a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Sarabun','Noto Sans Thai',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;background:radial-gradient(420px 420px at 100% 0,#ffe3ec 0,transparent 70%),radial-gradient(400px 400px at 0 100%,#dff0ff 0,transparent 70%),radial-gradient(300px 300px at 85% 95%,#e8f4ff 0,transparent 70%)}
.side{position:fixed;left:14px;top:14px;bottom:14px;width:226px;background:var(--card);border-radius:24px;box-shadow:0 4px 24px rgba(90,110,150,.08);padding:28px 14px;z-index:20;overflow-y:auto}
.brand{font-family:'Prompt','Sarabun',sans-serif;font-weight:500;font-size:15px;color:var(--dark);padding:0 12px 24px;line-height:1.35}
.brand{cursor:pointer}.brand .lg{display:block;width:46px;height:46px;border-radius:14px;object-fit:cover;margin-bottom:12px;background:linear-gradient(135deg,#ffb8cf,#a9d6ff)}.side .set{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.brand small{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px;font-family:'Sarabun',sans-serif}
.nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;margin-bottom:4px;border-radius:14px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;transition:all .15s}
.nav button:hover{background:#f3f9ff}
.nav button.on{background:var(--soft);color:#2a78b8;font-weight:600}
.top{display:none;position:sticky;top:0;z-index:15;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 18px;align-items:center;justify-content:space-between}
.top b{font-size:14px;font-weight:600}
main{margin-left:254px;padding:36px 40px 80px;max-width:1160px;position:relative}
h1{font-family:'Prompt','Sarabun',sans-serif;font-size:24px;font-weight:500;margin:0 0 4px;color:var(--dark)}
.sub{color:var(--mute);margin:0 0 26px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.card{border:0;border-radius:22px;padding:20px 22px;background:#fff;box-shadow:0 4px 20px rgba(90,110,150,.07)}
.grid .card:nth-child(1){background:#e3f2ff}
.grid .card:nth-child(2){background:#ffe8ef}
.grid .card:nth-child(3){background:#d9ecfb}
.grid .card:nth-child(4){background:#ffdde8}
.card .l{color:#7d6f76;font-size:13px}
.card .v{font-family:'Prompt','Sarabun',sans-serif;font-size:26px;font-weight:500;margin-top:6px;color:var(--dark)}
.card .n{font-size:12px;color:#8a7c83;margin-top:4px}
.inc{color:var(--inc)!important}.exp{color:var(--exp)!important}
.box{background:var(--card);border-radius:24px;padding:24px 26px;margin-bottom:24px;box-shadow:0 4px 24px rgba(90,110,150,.07)}
.box h2{font-family:'Prompt','Sarabun',sans-serif;font-size:16px;font-weight:500;margin:0 0 16px;color:var(--dark)}
main>.row{background:var(--card);border-radius:22px;padding:16px 20px;box-shadow:0 4px 20px rgba(90,110,150,.07);margin-bottom:20px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:18px}
.f{display:flex;flex-direction:column;gap:5px;min-width:150px}
.f label{font-size:12px;color:var(--mute);padding-left:4px}
input,select,textarea{font:inherit;font-size:14px;padding:10px 14px;border:1px solid #e6ecf6;border-radius:14px;background:#fafcff;color:var(--text);width:100%;transition:all .15s}
input[type=file]{padding:8px 10px;font-size:13px}
input:focus,select:focus,textarea:focus{outline:0;border-color:#8ec5f0;box-shadow:0 0 0 4px #e3f2ff}
textarea{resize:vertical;min-height:70px}
.btn{font:inherit;font-size:14px;border:1px solid var(--rose);background:var(--rose);color:#fff;padding:9px 22px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn:hover{background:var(--rose2);border-color:var(--rose2);transform:translateY(-1px)}
.btn.o{background:#fff;color:#2a78b8;border-color:#cfe5f8}
.btn.o:hover{background:var(--soft);border-color:#8ec5f0}
.btn.d{background:#fff;color:var(--exp);border-color:#f8d3df}
.btn.d:hover{background:#fff0f4}
.btn.s{padding:4px 14px;font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f6faff}
th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:#f8fbff}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;font-size:12px;background:#eef1f7;color:var(--mute)}
.tag.i{background:#e0f0fd;color:var(--inc)}
.tag.e{background:#ffe6ee;color:var(--exp)}
.empty{text-align:center;color:var(--mute);padding:36px 0}
.thumb{width:38px;height:38px;object-fit:cover;border-radius:10px;cursor:pointer;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(74,63,68,.28);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.md{background:#fff;border-radius:26px;box-shadow:0 16px 48px rgba(80,50,60,.18);padding:28px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.md h3{font-family:'Prompt','Sarabun',sans-serif;margin:0 0 18px;font-size:17px;font-weight:500}
.md .f{margin-bottom:14px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 22px;border-radius:99px;z-index:60;display:none;max-width:90vw;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.prev{margin-top:8px}
.prev img{max-width:160px;max-height:160px;border-radius:14px;display:block;margin-bottom:6px}
.prev .ths{display:flex;flex-wrap:wrap;gap:12px}.prev .th{width:130px}.prev .th img{width:130px;max-width:130px;max-height:170px;object-fit:cover;margin-bottom:4px}.prev .th .btn{width:100%}.prev .cnt{font-size:12px;color:var(--mute);margin-top:6px}
.eopt{display:flex;align-items:flex-start;gap:10px;margin:6px 0 14px;font-size:14px;cursor:pointer}.eopt input{width:20px;height:20px;margin-top:2px;flex:none}.eopt small{display:block;color:var(--mute);font-size:12px}
.vimgs img{width:100%;border-radius:12px;display:block;margin-bottom:10px}
.pbar{height:10px;border-radius:99px;background:#eef1f7;overflow:hidden;margin:8px 0}.pbar i{display:block;height:100%;background:var(--inc)}.pbar i.w{background:#e8a33d}.pbar i.d{background:var(--exp)}.tnote{font-size:13px;color:var(--mute);margin:10px 0 0;line-height:1.55}.best td{background:#e6f6ec}
#hsum{color:var(--mute);font-size:13px;background:#f6faff;border-radius:12px;padding:8px 14px;display:inline-block}
#hsum b{color:var(--dark);font-weight:600}
@media(max-width:900px){
.side{left:0;top:0;bottom:0;border-radius:0 24px 24px 0;transform:translateX(-105%);transition:.2s}
.side.open{transform:none;box-shadow:0 0 40px rgba(80,50,60,.2)}
.top{display:flex}
main{margin-left:0;padding:20px 14px 60px}
.box{padding:18px 16px;border-radius:20px}
.two{grid-template-columns:1fr}
.f{min-width:100%}
.row .btn{width:100%}
}

.lg-wrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:radial-gradient(420px 420px at 100% 0,#ffe3ec 0,transparent 70%),radial-gradient(400px 400px at 0 100%,#dff0ff 0,transparent 70%),#fbfcff}
.lg-card{width:100%;max-width:380px;background:#fff;border-radius:26px;padding:32px;box-shadow:0 8px 40px rgba(90,110,150,.14)}
.lg-logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#ffb8cf,#a9d6ff);margin-bottom:14px}
.lg-card .f{margin-bottom:14px}
.lerr{color:var(--exp);min-height:20px;font-size:13px;margin:4px 0 10px}
.need{border-color:var(--rose)!important;box-shadow:0 0 0 4px #ffe3ec!important}
#scanMsg{font-size:14px;color:var(--mute);line-height:1.8}
#scanMsg .btn{margin:0 4px 4px 0}

.bnav{display:none}
@media(max-width:700px){
main{padding:16px 12px 104px}
h1{font-size:21px}
.sub{margin-bottom:16px}
input,select,textarea{font-size:16px;padding:12px 14px}
.btn{min-height:44px;padding:10px 20px}
.btn.s{min-height:38px;padding:6px 14px}
.grid{grid-template-columns:1fr 1fr;gap:10px}
.card{padding:14px;border-radius:18px}
.card .v{font-size:19px}
.row{gap:10px}
.row .f{min-width:calc(50% - 5px);flex:1 1 calc(50% - 5px)}
.row .f[style*="flex:1"]{min-width:100%}
.two{gap:12px}
.acts .btn{flex:1}
.box{padding:16px 14px}
#toast{bottom:92px}
.bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:18;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px;justify-content:space-around}
.bnav button{flex:1;border:0;background:none;font:inherit;font-size:13px;color:var(--mute);padding:10px 2px;border-radius:12px;line-height:1.2;margin:0 2px}
.bnav button.on{color:#2a78b8;background:var(--soft);font-weight:600}
table.tx,table.tx tbody{display:block;width:100%}
table.tx thead{display:none}
table.tx tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name amt" "date type" "cat acc" "bal bal" "note note" "act act";gap:3px 12px;padding:12px 2px;border-bottom:1px solid var(--line)}
table.tx tr:last-child{border-bottom:0}
table.tx td{display:block;padding:0;border:0;min-width:0}
table.tx tbody tr:hover td{background:none}
table.tx td:nth-child(1){grid-area:date;color:var(--mute);font-size:13px}
table.tx td:nth-child(1) br{display:none}
table.tx td:nth-child(1) span{margin-left:6px}
table.tx td:nth-child(2){grid-area:name;font-weight:600;color:var(--dark)}
table.tx td:nth-child(3){grid-area:cat;font-size:13px;color:var(--mute)}
table.tx td:nth-child(4){grid-area:type;text-align:right}
table.tx td:nth-child(5){grid-area:amt;text-align:right;font-weight:600;font-size:16px}
table.tx td:nth-child(6){grid-area:bal;text-align:right;font-size:13px;color:var(--mute)}
table.tx td:nth-child(6) br{display:none}
table.tx td:nth-child(6) b{color:var(--dark);margin-right:6px}
table.tx td:nth-child(7){grid-area:acc;text-align:right;font-size:13px}
table.tx td:nth-child(8){grid-area:note;font-size:13px;color:var(--mute)}
table.tx td:nth-child(8):empty{display:none}
table.tx td:nth-child(9){grid-area:act;margin-top:6px}
table.tx td.empty{grid-area:1/1/7/3}
}

/* ---- ปรับปรุง: ฟอร์ม/มือถือ ---- */
.seg{display:flex;gap:6px;background:#f1f5fb;border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:15px;padding:10px 8px;border-radius:11px;color:var(--mute);cursor:pointer;transition:all .15s}
.seg button.on.exp{background:#fff;color:var(--exp);font-weight:600;box-shadow:0 2px 8px rgba(217,86,122,.18)}
.seg button.on.inc{background:#fff;color:var(--inc);font-weight:600;box-shadow:0 2px 8px rgba(47,134,198,.2)}
.rhint{font-size:12px;color:var(--inc);padding-left:4px;line-height:1.5}
.rhint:empty{display:none}
.okb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#e6f6ec;color:#2b6b45;border-radius:16px;padding:12px 16px;margin:0 0 16px;max-width:720px;font-size:14px}
.okb a{color:#2a78b8;cursor:pointer;text-decoration:underline;white-space:nowrap}
input[type=file]::file-selector-button{font:inherit;font-size:13px;border:0;background:var(--soft);color:#2a78b8;padding:7px 14px;border-radius:99px;margin-right:10px;cursor:pointer}
.fx{display:contents}.ftog{display:none}
@media(max-width:700px){
.top .btn{display:none}
.bnav{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
main{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
#toast{bottom:calc(92px + env(safe-area-inset-bottom))}
.frm .two{grid-template-columns:1fr 1fr;gap:12px}
.frm .two .f{min-width:0;margin:0}
.frm .c-ft{order:1;grid-column:1/-1}.frm .c-am{order:2;grid-column:1/-1}.frm .c-nm{order:3;grid-column:1/-1}.frm .c-cg{order:4;grid-column:1/-1}
.frm .c-d{order:5}.frm .c-tm{order:6}.frm .c-ch{order:7}.frm .c-ac{order:8}.frm .c-im{order:9;grid-column:1/-1}
.frm #fm{font-size:24px;font-weight:600;padding:14px;color:var(--dark)}
.seg button{padding:13px 8px;font-size:16px}
.frm .stk{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));background:linear-gradient(to top,#fff 78%,rgba(255,255,255,0));margin:14px -14px -16px;padding:14px 14px 16px;z-index:5;border-radius:0 0 20px 20px;flex-wrap:nowrap}
.frm .stk .btn:first-child{flex:2}
.ftog{display:block;width:100%;margin-top:2px}
.hrow .fx{display:none;width:100%}
.hrow .fx.open{display:flex;flex-wrap:wrap;gap:10px}
.hrow .f[style*="flex:1"]{min-width:100%}
.tw table:not(.tx) th,.tw table:not(.tx) td{padding:10px 8px;font-size:13px}
.tw table:not(.tx) th,.tw table:not(.tx) td:first-child{white-space:nowrap}
table.tx td:nth-child(9) .btn{flex:none}
table.tx td:nth-child(9){display:flex;gap:8px}
#scanMsg{font-size:13px;line-height:1.7}
.okb{border-radius:14px}
}
.dupl{margin:8px 0 12px;padding-left:20px;font-size:14px}.dtag{display:inline-block;background:#fff3d6;color:#9a6b00;border-radius:99px;padding:0 8px;font-size:12px}
.wrnb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff6e0;color:#8a6200;border-radius:16px;padding:12px 16px;margin:0 0 16px;font-size:14px}.wrnb a{color:#2a78b8;cursor:pointer;text-decoration:underline;white-space:nowrap}
.bal .bs{font-size:12px;color:var(--mute);font-weight:400}.bal{white-space:nowrap}
.bkst{font-size:14px;color:var(--mute);margin:0 0 12px}
.seg button.on.dt{background:#fff;color:var(--rose);font-weight:600;box-shadow:0 2px 8px rgba(217,86,122,.18)}
.sgprev{display:inline-block;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 14px;margin-bottom:10px}.sgprev img{display:block;max-height:70px;max-width:240px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.drow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.drow .dd1{flex:1;min-width:0}.drow .dq{width:84px;flex:none}.drow .dp{width:120px;flex:none}.drow .da{width:100px;text-align:right;font-weight:600;flex:none;font-size:14px}
@media(max-width:700px){.dgrid{grid-template-columns:1fr}.drow{flex-wrap:wrap}.drow .dd1{flex:1 1 100%}.drow .dq{width:80px}.drow .dp{flex:1;width:auto}}
.dpw{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff}.dpi{width:794px;transform-origin:top left}

.dc .dsn{font-size:20px;font-weight:700;line-height:1.3}.dc .dsm{font-size:12.5px;color:#6b5d63;white-space:pre-line}
.dc .dtt{text-align:right}.dc .dtt h2{margin:0;font-size:27px;color:#d9617f;font-weight:700;line-height:1.2}.dc .den{font-size:12px;letter-spacing:2px;color:#9a8c92}

.dc .dnt{margin-top:18px;font-size:12.5px;color:#6b5d63;white-space:pre-line}.dc .dnt b{color:#3b2f35}

.sgi{padding:10px 14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:14px;border-bottom:1px solid #f4f6fb}.sgi:hover{background:#f3f9ff}.sgi small{color:var(--mute);white-space:nowrap}.sgi .pb{background:#e6f3ff;color:#2a78b8;border-radius:99px;padding:0 8px}

function uid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)})}

function iso(back){var d=new Date();d.setDate(d.getDate()-back);return d.toLocaleDateString('sv-SE')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dth(s){if(!s)return '-';var p=s.split('-');return p[2]+'/'+p[1]+'/'+(+p[0]+543)}

var S;
var SB={url:'https://vwgysbjieksxkramurfp.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3Z3lzYmppZWtzeGtyYW11cmZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MDIwNzMsImV4cCI6MjExMDM3ODA3M30.c5WRrjgYDYXW7TvsAG-_gW-DKXuMOBf6zSbWs69HxgI',owner:'fadf6bf6-37d3-45f8-b5ba-7ed0733d1de9'};

function allCats(){var a=INCC.concat(EXPC);S.tx.forEach(function(t){if(t.cat&&a.indexOf(t.cat)<0)a.push(t.cat)});return a}

var SES=null,SESKEY='ie_session_v1';
function loadSes(){try{SES=JSON.parse(localStorage.getItem(SESKEY)||'null')}catch(e){SES=null}}
function saveSes(d){SES={access_token:d.access_token,refresh_token:d.refresh_token,exp:Math.floor(Date.now()/1000)+(d.expires_in||3600)};try{localStorage.setItem(SESKEY,JSON.stringify(SES))}catch(e){}}
function auth(path,body){
  return fetch(SB.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){
    return r.json().then(function(j){if(!r.ok)throw new Error(j.error_description||j.msg||j.message||String(r.status));return j});
  });
}
function token(){
  if(!SES)return Promise.reject(new Error('NOAUTH'));
  if(SES.exp-Math.floor(Date.now()/1000)>60)return Promise.resolve(SES.access_token);
  return auth('token?grant_type=refresh_token',{refresh_token:SES.refresh_token}).then(function(d){saveSes(d);return SES.access_token}).catch(function(){logout(true);throw new Error('NOAUTH')});
}
function api(method,path,body,hdr){
  return token().then(function(t){
    var h={apikey:SB.key,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'return=minimal'};
    if(hdr)for(var k in hdr)h[k]=hdr[k];
    return fetch(SB.url+'/rest/v1/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
  }).then(function(r){
    if(r.status===401){logout(true);throw new Error('NOAUTH')}
    if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t)});
    return r.text().then(function(t){return t?JSON.parse(t):null});
  });
}
function showLogin(msg){$('login').style.display='flex';$('lerr').textContent=msg||'';setTimeout(function(){$('le').focus()},50)}
function doLogin(){
  var em=$('le').value.trim(),pw=$('lp').value;

  auth('token?grant_type=password',{email:em,password:pw}).then(function(d){
    if(!d.user||d.user.id!==SB.owner)throw new Error('บัญชีนี้ไม่มีสิทธิ์เข้าใช้งาน');
    saveSes(d);$('login').style.display='none';$('lp').value='';startApp();
  }).catch(function(e){$('lerr').textContent=e.message==='Invalid login credentials'?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':e.message}).then(function(){$('lb').disabled=false});
}
function logout(silent){
  SES=null;try{localStorage.removeItem(SESKEY);localStorage.removeItem(KEY)}catch(e){}
  S={shop:{name:'',logo:''},acc:[],tx:[]};
  $('side').classList.remove('open');closeM();
  showLogin(silent===true?'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่':'');
}
function getAll(path){
  var out=[];
  function pg(o){return api('GET',path+'&limit=1000&offset='+o).then(function(r){r=r||[];out=out.concat(r);return r.length===1000?pg(o+1000):out})}
  return pg(0);
}
function fromAcc(r){return{id:r.id,ch:r.channel,name:r.name,open:Number(r.opening_balance)}}
function fromTx(r){return{id:r.id,date:r.tx_date,type:r.type,name:r.name,cat:r.category,amt:Number(r.amount),note:r.note||'',ch:r.channel,acc:r.account_id,hasImg:!!r.has_image,time:(r.tx_time||'').slice(0,5),qty:r.qty==null?null:Number(r.qty),cost:r.cost==null?null:Number(r.cost)}}
function pull(){
  return Promise.all([
    api('GET','shop_settings?select=name,logo'),
    getAll('accounts?select=*&order=created_at.asc,id.asc'),
    pullTx(),
    api('GET','shop_settings?select=categories').catch(function(){return null})
  ]).then(function(r){
    var sh=(r[0]&&r[0][0])||{};
    var cc=r[3]&&r[3][0]&&r[3][0].categories;
    S={shop:{name:sh.name||'',logo:sh.logo||''},acc:r[1].map(fromAcc),tx:r[2].map(fromTx),cats:cc||(S&&S.cats)||null};
    applyCats();cache();
  });
}
function init(){try{localStorage.removeItem('ie_tracker_v1')}catch(e){}loadSes();if(!SES){showLogin();return}startApp()}
function startApp(){
  S={shop:{name:'',logo:''},acc:[],tx:[]};
  try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);fixS()}}catch(e){}
  view='dash';render();
  pull().then(function(){autoSnap('อัตโนมัติ','auto');if(view!=='form'&&!$('modalRoot').innerHTML)render();else drawBrand()}).catch(function(e){if(e&&e.message==='NOAUTH')return;console.error(e);toast('เชื่อมต่อ Supabase ไม่สำเร็จ กำลังแสดงข้อมูลที่เก็บไว้ในเครื่อง')});
}
function sum(list){var i=0,e=0;list.forEach(function(t){if(t.type==='inc')i+=+t.amt;else e+=+t.amt});return{inc:i,exp:e,net:i-e}}
function accBal(a){var s=sum(S.tx.filter(function(t){return t.acc===a.id}));return{inc:s.inc,exp:s.exp,bal:(+a.open||0)+s.net}}
function chBal(ch){return S.acc.filter(function(a){return a.ch===ch}).reduce(function(x,a){return x+accBal(a).bal},0)}
function accName(id){var a=S.acc.find(function(x){return x.id===id});return a?a.name:'-'}
function inPeriod(t,p,v){return p==='all'||!v||t.date.indexOf(v)===0}

/* ---------- สถานะหน้า ---------- */
var view='dash',editId=null,preset='chat',formImgs=[],imgTouched=false;
var D={scope:'all',p:'month',v:today().slice(0,7)};
var H={q:'',from:'',to:'',type:'',cat:'',ch:''};
var E={ch:'all',from:'',to:'',slip:false,tax:false};var MAXIMG=3;

function toggleSide(){$('side').classList.toggle('open')}
var slipRecv='',typeTouched=false,backView='',backY=0,lastAcc='',savedMsg='';
function goBack(){var v=backView||'hist',y=backY;backView='';go(v);setTimeout(function(){window.scrollTo(0,y)},30)}
function go(v,id,ch){if(v==='form'&&id){var lt=S.tx.find(function(x){return x.id===id});if(lt&&isLocked(lt.date)){toast(lockMsg(),5000);return}}var prev=view;view=v;if(v==='form'){slipRecv='';typeTouched=false;editId=id||null;if(id){backView=(prev&&prev!=='form')?prev:'hist';backY=window.scrollY||0}else{backView='';backY=0}if(ch)preset=ch;formImgs=[];oldImgVals=[];imgTouched=false;if(id){var t=S.tx.find(function(x){return x.id===id});if(t&&t.hasImg){api('GET','transactions?id=eq.'+id+'&select=image').then(function(r){if(editId===id&&r&&r[0]){oldImgVals=parseImgVals(r[0].image||'');return resolveImgs(r[0].image||'').then(function(ims){if(editId===id&&!imgTouched){formImgs=ims;if(view==='form'&&$('prev'))showPrev()}})}}).catch(function(){})}}}
  $('side').classList.remove('open');render();window.scrollTo(0,0)}
function drawBrand(){

  showLogo();setTimeout(function(){$('sn').focus()},50);
}
function showLogo(){
  $('lprev').innerHTML=tmpLogo?'<img src="'+tmpLogo+'" style="max-width:120px;max-height:120px"><span style="font-size:12px;color:var(--mute)">ขนาดหลังบีบอัด ~'+Math.round(tmpLogo.length*0.75/1024)+' KB</span> <button class="btn d s" type="button" onclick="tmpLogo=\'\';$(\'sl\').value=\'\';showLogo()">ลบโลโก้</button>':'';
}
function pickLogo(inp){
  var f=inp.files[0];if(!f)return;
  if(f.type.indexOf('image/')!==0){toast('กรุณาเลือกไฟล์รูปภาพ');inp.value='';return}
  var r=new FileReader();
  r.onload=function(e){
    var im=new Image();
    im.onload=function(){
      var k=Math.min(1,256/Math.max(im.width,im.height));
      var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      tmpLogo=c.toDataURL('image/webp',0.85);showLogo();
    };
    im.onerror=function(){toast('เปิดรูปภาพไม่ได้')};
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}
function saveShop(){
  var sh={name:$('sn').value.trim(),logo:tmpLogo};
  api('POST','shop_settings?on_conflict=owner_id',{owner_id:SB.owner,name:sh.name,logo:sh.logo},{Prefer:'resolution=merge-duplicates,return=minimal'}).then(function(){

}

}


/* ---------- จัดการหมวดหมู่ ---------- */

function rnLocal(){try{var a=JSON.parse(localStorage.getItem(RNKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function rnSaveLocal(L){try{localStorage.setItem(RNKEY,JSON.stringify(L))}catch(e){}}
function rnames(){var a=((S&&S.cats&&S.cats.rn)||[]).slice();rnLocal().forEach(function(n){if(!a.some(function(x){return sameName(x,n)}))a.push(n)});return a}
function catsObj(rn){var c=(S&&S.cats)||{};return{inc:INCC.slice(),exp:EXPC.slice(),rn:(rn||rnames()).slice(),nt:ntList(),dc:c.dc||{},docs:c.docs||[],dset:c.dset||{},prods:c.prods||[],lock:c.lock||'',audit:c.audit||[]}}
function saveCats(){
  S.cats=catsObj();
  return api('POST','shop_settings?on_conflict=owner_id',{owner_id:SB.owner,name:S.shop.name,logo:S.shop.logo,categories:S.cats},{Prefer:'resolution=merge-duplicates,return=minimal'}).then(function(){cache()});
}
function catErr(e){
  if(e&&e.message==='NOAUTH')return;
  console.error(e);
  modal('<h3>บันทึกหมวดหมู่ไม่สำเร็จ</h3><p style="word-break:break-all;font-size:12px">รายละเอียด: '+esc(String((e&&e.message)||'').slice(0,300))+'</p><p>ถ้าข้อความข้างบนพูดถึงคอลัมน์ categories ให้เพิ่มคอลัมน์ในฐานข้อมูลก่อน (ทำครั้งเดียว) ไปที่ Supabase &gt; SQL Editor แล้วรันคำสั่งนี้:</p><p><code>alter table shop_settings add column if not exists categories jsonb;</code></p><p>จากนั้นรีเฟรชหน้าแล้วลองใหม่</p><div class="acts"><button class="btn" onclick="closeM()">ปิด</button></div>');
}
function catList(t){return t==='inc'?INCC:EXPC}
function rCats(){

    }).join('');
    return '<div class="box" style="max-width:720px"><h2>'+title+'</h2><div class="tw"><table><thead><tr><th>ชื่อหมวดหมู่</th><th class="r">ใช้งาน</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="row" style="margin-top:12px;gap:8px"><input id="nc_'+t+'" placeholder="ชื่อหมวดหมู่ใหม่" style="flex:1" onkeydown="if(event.key===\'Enter\')addCat(\''+t+'\')"><button class="btn s" onclick="addCat(\''+t+'\')">เพิ่มหมวดหมู่</button></div></div>';
  }
  $('main').innerHTML='<h1>จัดการหมวดหมู่</h1><p class="sub">เพิ่ม แก้ไขชื่อ หรือลบหมวดหมู่รายรับและรายจ่าย การแก้ชื่อจะอัปเดตรายการเดิมที่ใช้หมวดหมู่นี้ให้อัตโนมัติ</p>'+box('inc','หมวดหมู่รายรับ')+box('exp','หมวดหมู่รายจ่าย')+rnBox();
}
function addCat(t){
  var el=$('nc_'+t),v=el.value.trim();
  if(!v){toast('กรุณากรอกชื่อหมวดหมู่');return}
  if(INCC.concat(EXPC).indexOf(v)>=0){toast('มีหมวดหมู่ชื่อนี้อยู่แล้ว');return}
  catList(t).push(v);
  saveCats().then(function(){toast('เพิ่มหมวดหมู่แล้ว');rCats()}).catch(function(e){catList(t).pop();S.cats=catsObj();catErr(e);rCats()});
}
var renCtx=null;
function renCat(t,i){
  renCtx={t:t,i:i};
  modal('<h3>แก้ไขชื่อหมวดหมู่</h3><div class="f"><label>ชื่อหมวดหมู่</label><input id="rc" value="'+esc(catList(t)[i])+'" onkeydown="if(event.key===\'Enter\')doRenCat()"></div><div class="acts"><button class="btn o" onclick="closeM()">ยกเลิก</button><button class="btn" onclick="doRenCat()">บันทึก</button></div>');
  setTimeout(function(){$('rc').focus()},50);
}
function doRenCat(){
  var t=renCtx.t,i=renCtx.i,L=catList(t),old=L[i],v=$('rc').value.trim();
  if(!v){toast('กรุณากรอกชื่อหมวดหมู่');return}
  if(v===old){closeM();return}
  if(INCC.concat(EXPC).indexOf(v)>=0){toast('มีหมวดหมู่ชื่อนี้อยู่แล้ว');return}
  L[i]=v;ntRename(t,old,v);
  var used=S.tx.some(function(x){return x.type===t&&x.cat===old});
  saveCats().then(function(){
    if(!used)return;
    return api('PATCH','transactions?type=eq.'+t+'&category=eq.'+encodeURIComponent(old),{category:v}).then(function(){S.tx.forEach(function(x){if(x.type===t&&x.cat===old)x.cat=v})});
  }).then(function(){cache();closeM();toast('แก้ไขหมวดหมู่แล้ว');rCats()}).catch(function(e){L[i]=old;ntRename(t,v,old);S.cats=catsObj();closeM();catErr(e)});
}
function delCat(t,i){
  var L=catList(t),c=L[i];
  if(L.length<2){toast('ต้องมีหมวดหมู่อย่างน้อย 1 รายการ');return}
  var n=S.tx.filter(function(x){return x.type===t&&x.cat===c}).length;
  confirmBox('ลบหมวดหมู่ “'+esc(c)+'” ?'+(n?'<br>มี '+n+' รายการที่ใช้หมวดหมู่นี้ รายการเดิมจะยังคงอยู่และยังแสดงชื่อหมวดหมู่เดิม':''),function(){
    L.splice(i,1);
    saveCats().then(function(){toast('ลบหมวดหมู่แล้ว');rCats()}).catch(function(e){L.splice(i,0,c);S.cats=catsObj();catErr(e);rCats()});
  });
}


/* ---------- ที่เก็บรูป (Supabase Storage, bucket: slips) ---------- */
function stHdr(t,extra){var h={apikey:SB.key,Authorization:'Bearer '+t};if(extra)for(var k in extra)h[k]=extra[k];return h}
function stCheck(r){if(r.status===401){logout(true);throw new Error('NOAUTH')}if(!r.ok)return r.text().then(function(t){throw new Error('storage '+r.status+' '+t)});return r}
function stUpload(path,dataUrl){
  return Promise.all([token(),fetch(dataUrl).then(function(r){return r.blob()})]).then(function(a){
    return fetch(SB.url+'/storage/v1/object/slips/'+path,{method:'POST',headers:stHdr(a[0],{'Content-Type':'image/jpeg','x-upsert':'true'}),body:a[1]});
  }).then(stCheck).then(function(){return path});
}
function stDelete(path){return token().then(function(t){return fetch(SB.url+'/storage/v1/object/slips/'+path,{method:'DELETE',headers:stHdr(t)})}).catch(function(){})}
function blobToDataUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}
/* ค่าในคอลัมน์ image: data:... = รูปเก่าในฐานข้อมูล, อย่างอื่น = path ใน Storage */
function resolveImg(v){
  if(!v)return Promise.resolve('');
  if(v.indexOf('data:')===0)return Promise.resolve(v);
  if(v.indexOf('r2:')===0){if(!r2On())return Promise.reject(new Error('ยังไม่ได้ตั้งค่า R2_URL'));return r2Req('GET',v.slice(3)).then(function(r){return r.blob()}).then(blobToDataUrl)}
  return token().then(function(t){return fetch(SB.url+'/storage/v1/object/authenticated/slips/'+v,{headers:stHdr(t)})}).then(stCheck).then(function(r){return r.blob()}).then(blobToDataUrl);
}

function r2On(){return !!R2_URL}
function r2Req(method,key,body){
  return token().then(function(t){return fetch(R2_URL.replace(/\/+$/,'')+'/img/'+key,{method:method,headers:{Authorization:'Bearer '+t,apikey:SB.key},body:body})}).then(stCheck);
}
function r2Put(id,dataUrl){return fetch(dataUrl).then(function(r){return r.blob()}).then(function(b){return r2Req('PUT',id+'.jpg',b)}).then(function(){return 'r2:'+id+'.jpg'})}
/* หลายรูปต่อรายการ (สูงสุด 3): รูปที่ 1 ใช้ชื่อ id เดิม, รูปที่ 2-3 ใช้ id_2 / id_3 ; คอลัมน์ image เก็บเป็นค่าเดียว (เหมือนเดิม) หรือ JSON array เมื่อมีมากกว่า 1 รูป */
function imgName(id,i){return i?uid():id}
var oldImgVals=[];
function delStored(v){if(!v||v.indexOf('data:')===0)return;if(v.indexOf('r2:')===0){var k=v.slice(3);if(r2On())r2Req('DELETE',k).catch(function(){});stDelete(k)}else stDelete(v)}
function parseImgVals(v){if(!v)return[];if(v.charAt(0)==='['){try{var a=JSON.parse(v);return Array.isArray(a)?a.filter(Boolean):[]}catch(e){return[]}}return[v]}
function resolveImgs(v){return Promise.all(parseImgVals(v).map(resolveImg))}
function putImgs(id,arr){return Promise.all(arr.map(function(d,i){return putImg(imgName(id,i),d)})).then(function(vals){return vals.length===1?vals[0]:JSON.stringify(vals)})}
/* เก็บรูป: ใช้ R2 ถ้าตั้งค่าแล้ว ไม่งั้นใช้ Supabase Storage; คืนค่าที่จะเก็บในคอลัมน์ image */
function putImg(id,dataUrl){
  if(r2On())return r2Put(id,dataUrl).then(function(v){stDelete(id+'.jpg');return v});
  return stUpload(id+'.jpg',dataUrl);
}
function delImg(id){if(r2On())r2Req('DELETE',id+'.jpg').catch(function(){});stDelete(id+'.jpg')}
var migRun=false;
function migrateImgs(){
  if(migRun)return;migRun=true;
  var done=0,fails=0;
  var flt=r2On()?'image=not.is.null&image=neq.&image=not.like.r2:*&image=not.like.[*':'image=like.data:*';
  function msg(m){var el=$('migmsg');if(el)el.textContent=m}
  function step(){
    api('GET','transactions?select=id&'+flt+'&limit=10').then(function(rows){
      rows=rows||[];
      if(!rows.length){migRun=false;msg('ย้ายเสร็จแล้ว '+done+' รูป'+(fails?' (ไม่สำเร็จ '+fails+')':''));return}
      return Promise.all(rows.map(function(r){
        return api('GET','transactions?id=eq.'+r.id+'&select=image').then(function(x){
          var old=x&&x[0]&&x[0].image;if(!old)return;
          return resolveImg(old).then(function(img){return putImg(r.id,img)}).then(function(path){return api('PATCH','transactions?id=eq.'+r.id,{image:path})}).then(function(){done++});
        }).catch(function(e){fails++;console.error(e)});
      })).then(function(){
        msg('กำลังย้ายรูป... สำเร็จ '+done+' รูป'+(fails?' (ไม่สำเร็จ '+fails+')':''));
        if(fails>0&&done===0){migRun=false;msg('ย้ายไม่สำเร็จ ตรวจสอบการตั้งค่า Worker/R2 หรือ bucket แล้วลองใหม่');return}
        if(fails>=10){migRun=false;msg('หยุดย้ายเพราะมีรูปที่ย้ายไม่สำเร็จ '+fails+' รูป (สำเร็จ '+done+')');return}
        step();
      });
    }).catch(function(e){migRun=false;msg('ผิดพลาด: '+String((e&&e.message)||e).slice(0,160))});
  }
  msg('เริ่มย้ายรูป...');step();
}


/* ---------- ชื่อผู้รับที่ถือเป็นรายรับ ---------- */
function cleanNm(x){return String(x||'').replace(/^(นางสาว|น\.ส\.|นส\.|นาย|นาง|คุณ|mr\.?|mrs\.?|ms\.?|miss)\s*/i,'').replace(/\s+/g,' ').trim().slice(0,60)}
function nmKey(x){return cleanNm(x).toLowerCase().replace(/[^a-zก-๙]/g,'')}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));return d[m][n]}
function sameName(a,b){
  a=nmKey(a);b=nmKey(b);
  if(a.length<3||b.length<3)return false;
  if(a.indexOf(b)>-1||b.indexOf(a)>-1)return true;
  return lev(a,b)/Math.max(a.length,b.length)<=0.25;
}
function isIncRecv(p){
  var L=rnames();
  return (p.recvC||[]).some(function(c){return L.some(function(n){return sameName(n,c)})});
}
function addRecvName(n){
  n=cleanNm(n);if(!n||nmKey(n).length<3)return;
  if(rnames().some(function(x){return sameName(x,n)}))return;
  var rn=rnames().concat([n]);
  rnSaveLocal(rn);S.cats=catsObj(rn);
  saveCats().catch(function(e){if(e&&e.message==='NOAUTH')return;console.error(e);toast('จำชื่อผู้รับไว้ในเครื่องนี้แล้ว แต่บันทึกขึ้นระบบไม่สำเร็จ')});
}
function rnBox(){
  var L=rnames();
  var rows=L.map(function(n,i){return '<tr><td>'+esc(n)+'</td><td style="text-align:right"><button class="btn d s" onclick="delRn('+i+')">ลบ</button></td></tr>'}).join('')||'<tr><td colspan="2" class="empty">ยังไม่มีชื่อที่จำไว้</td></tr>';
  return '<div class="box" style="max-width:720px"><h2>ชื่อผู้รับในสลิปที่ถือเป็นรายรับ</h2><p class="sub" style="margin-bottom:12px">ถ้าสลิปที่สแกนมีชื่อผู้รับตรงกับรายการนี้ ระบบจะตั้งประเภทเป็น “รายรับ” ให้อัตโนมัติ ชื่อจะถูกจำเองเมื่อคุณบันทึกสลิปเป็นรายรับ หรือจะเพิ่มเองตรงนี้ก็ได้</p><div class="tw"><table><tbody>'+rows+'</tbody></table></div><div class="row" style="margin-top:12px;gap:8px"><input id="nrn" placeholder="ชื่อผู้รับตามที่แสดงในสลิป" style="flex:1" onkeydown="if(event.key===\'Enter\')addRn()"><button class="btn s" onclick="addRn()">เพิ่มชื่อ</button></div></div>';
}
function addRn(){
  var v=cleanNm($('nrn').value);
  if(nmKey(v).length<3){toast('กรุณากรอกชื่ออย่างน้อย 3 ตัวอักษร');return}
  if(rnames().some(function(x){return sameName(x,v)})){toast('มีชื่อนี้อยู่แล้ว');return}
  var old=rnames().slice(),nw=old.concat([v]);
  rnSaveLocal(nw);S.cats=catsObj(nw);
  saveCats().then(function(){toast('เพิ่มชื่อแล้ว');rCats()}).catch(function(e){rnSaveLocal(old);S.cats=catsObj(old);catErr(e);rCats()});
}
function delRn(i){
  var old=rnames().slice(),rn=old.slice();rn.splice(i,1);
  rnSaveLocal(rn);S.cats=catsObj(rn);
  saveCats().then(function(){toast('ลบชื่อแล้ว');rCats()}).catch(function(e){rnSaveLocal(old);S.cats=catsObj(old);catErr(e);rCats()});
}

/* ---------- หน้าระบบแต่ละช่องทาง ---------- */
var RB={};
function totalNet(){return S.acc.reduce(function(x,a){return x+accBal(a).bal},0)}
function runBal(){
  RB={};var ab={},all=0;
  S.acc.forEach(function(a){ab[a.id]=+a.open||0;all+=+a.open||0});
  S.tx.slice().sort(txCmp).reverse().forEach(function(t){
    var d=t.type==='inc'?+t.amt:-t.amt;
    ab[t.acc]=(ab[t.acc]||0)+d;all+=d;RB[t.id]={a:ab[t.acc],all:all};
  });
}
function txRow(t,showCh){
  var rb=RB[t.id];
  return '<tr><td>'+dth(t.date)+(t.time?'<br><span style="color:var(--mute);font-size:13px">'+t.time+' น.</span>':'')+'</td><td>'+esc(t.name)+'</td><td>'+esc(t.cat)+'</td><td><span class="tag '+(t.type==='inc'?'i':'e')+'">'+(t.type==='inc'?'รายรับ':'รายจ่าย')+'</span></td><td class="r '+(t.type==='inc'?'inc':'exp')+'">'+money(t.amt)+'</td>'+
  '<td class="r bal">'+(rb?'<b>'+money(rb.a)+'</b>':'-')+'</td>'+
  '<td>'+(showCh?CH[t.ch]+'<br>':'')+'<span style="color:var(--mute);font-size:13px">'+esc(accName(t.acc))+'</span></td>'+
  '<td>'+esc(t.note)+(t.hasImg?'<br><button class="btn o s" style="margin-top:6px" onclick="viewImg(\''+t.id+'\')">ดูรูป</button>':'')+'</td>'+
  '<td style="white-space:nowrap">'+(isLocked(t.date)?'<span class="lkb">🔒 ล็อกแล้ว</span>':'<button class="btn o s" onclick="go(\'form\',\''+t.id+'\')">แก้ไข</button> <button class="btn d s" onclick="delTx(\''+t.id+'\')">ลบ</button>')+'</td></tr>';
}
function rChan(ch){
  runBal();
  var L=S.tx.filter(function(t){return t.ch===ch}).sort(txCmp);
  var s=sum(L);
  var accs=S.acc.filter(function(a){return a.ch===ch});
  var ar=accs.map(function(a){var b=accBal(a);return '<tr><td>'+esc(a.name)+'</td><td class="r">'+money(a.open)+'</td><td class="r inc">'+money(b.inc)+'</td><td class="r exp">'+money(b.exp)+'</td><td class="r"><b>'+money(b.bal)+'</b></td><td style="white-space:nowrap"><button class="btn o s" onclick="accForm(\''+a.id+'\')">แก้ไข</button> <button class="btn d s" onclick="delAcc(\''+a.id+'\')">ลบ</button></td></tr>'}).join('')||'<tr><td colspan="6" class="empty">ยังไม่มีบัญชี กรุณาเพิ่มบัญชีรับเงิน</td></tr>';
  var tr=L.slice(0,10).map(function(t){return txRow(t,false)}).join('')||'<tr><td colspan="9" class="empty">ยังไม่มีรายการ</td></tr>';
  $('main').innerHTML='<h1>ระบบ'+CH[ch]+'</h1><p class="sub">ข้อมูลรายรับ รายจ่าย และบัญชีรับเงินของช่องทางนี้โดยเฉพาะ</p>'+

function compressImg(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onerror=function(){rej(new Error('read'))};
    r.onload=function(e){
      var im=new Image();
      im.onerror=function(){rej(new Error('img'))};
      im.onload=function(){
        var M=800,w=im.width,h=im.height,k=Math.min(1,M/Math.max(w,h));
        var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.7));
      };
      im.src=e.target.result;
    };
    r.readAsDataURL(f);
  });
}
function pickImg(inp){
  var fs=Array.prototype.slice.call(inp.files||[]);if(!fs.length)return;
  var room=MAXIMG-formImgs.length;
  if(room<=0){toast('แนบได้สูงสุด '+MAXIMG+' รูป กรุณาลบรูปก่อน');inp.value='';return}
  var bad=fs.some(function(f){return f.type.indexOf('image/')!==0});
  fs=fs.filter(function(f){return f.type.indexOf('image/')===0});
  var over=fs.length>room;fs=fs.slice(0,room);
  if(!fs.length){toast('กรุณาเลือกไฟล์รูปภาพ');inp.value='';return}
  Promise.all(fs.map(compressImg)).then(function(ims){
    ims.forEach(function(im){formImgs.push(im)});imgTouched=true;showPrev();
    if(over)toast('แนบได้สูงสุด '+MAXIMG+' รูป ระบบเพิ่มให้เท่าที่ได้');else if(bad)toast('ข้ามไฟล์ที่ไม่ใช่รูปภาพ');
  }).catch(function(){toast('เปิดรูปภาพไม่ได้')}).then(function(){inp.value=''});
}

    return loc;
  }).catch(function(e){if(e&&e.message==='NOAUTH')throw e;return loc});

function saveTx(){
  if(saving)return;
  var o={date:$('fd').value,time:$('ftime').value||'',type:$('ft').value,ch:$('fc').value,acc:$('fa').value,name:$('fn').value.trim(),cat:$('fg').value,amt:parseFloat($('fm').value),note:$('fo').value.trim()};

  if(!o.name){toast('กรุณากรอกชื่อรายการ');return}
  if(!o.acc){toast('กรุณาเลือกบัญชี หากไม่มีให้เพิ่มบัญชีก่อน');return}
  if(!(o.amt>0)){toast('กรุณากรอกจำนวนเงินมากกว่า 0');return}
  var old=editId?S.tx.find(function(x){return x.id===editId}):null;
  if(isLocked(o.date)||(old&&isLocked(old.date))){toast(lockMsg(),5000);return}
  applyProdToTx(o,old);
  var keyChanged=!old||old.date!==o.date||old.type!==o.type||old.acc!==o.acc||Math.abs(+old.amt-o.amt)>=0.005;
  if(!keyChanged){commitTx(o);return}
  saving=true;busyBtn(true);

}
function dupYes(){var o=pendDup;pendDup=null;closeM();if(o)commitTx(o)}
function commitTx(o){

    if(!wasEdit&&slipRecv&&o.type==='inc')addRecvName(slipRecv);editId=null;formImgs=[];imgTouched=false;preset=o.ch;lastAcc=o.acc;slipRecv='';
    if(wasEdit){goBack()}
    else{savedMsg='<div class="okb"><span><b>✓ บันทึกแล้ว</b> '+esc(o.name)+' · <b class="'+(o.type==='inc'?'inc':'exp')+'">'+(o.type==='inc'?'+':'−')+money(o.amt)+'</b> บาท'+(ac?'<br>ยอดสุทธิบัญชี <b>'+esc(ac.name)+'</b> : <b>'+money(accBal(ac).bal)+'</b> บาท':'')+'</span><a onclick="go(\'hist\')">ดูในประวัติ</a></div>';go('form')}
  }).catch(fail).then(function(){saving=false;busyBtn(false)});

function loadExpImgs(L){

    return p.then(function(){return api('GET','transactions?select=id,image&id=in.('+g.join(',')+')')}).then(function(rows){(rows||[]).forEach(function(r){pending.push(r)})});
  },Promise.resolve()).then(function(){
    var idx=0;

      if(idx>=pending.length)return Promise.resolve();

    if(!S||!S.tx||(!S.tx.length&&!S.acc.length))return;
    var L=bkList(),last=L[L.length-1],gap=last?Date.now()-new Date(last.at).getTime():1e12;

function sgFinish(src){
  var w=src.width,h=src.height,d=src.getContext('2d').getImageData(0,0,w,h).data,x0=w,y0=h,x1=-1,y1=-1,x,y;
  for(y=0;y<h;y++)for(x=0;x<w;x++){if(d[(y*w+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)return '';
  var pad=8;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
  var cw=x1-x0+1,ch=y1-y0+1,sc=Math.min(1,400/cw,160/ch),o=document.createElement('canvas');
  o.width=Math.max(1,Math.round(cw*sc));o.height=Math.max(1,Math.round(ch*sc));
  o.getContext('2d').drawImage(src,x0,y0,cw,ch,0,0,o.width,o.height);
  return o.toDataURL('image/png');
}

  var c=$('sgc'),x=c.getContext('2d'),dn=false;
  c.style.height=Math.round(c.clientWidth*0.4)+'px';
  x.lineWidth=6;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#1d2a55';
  function pt(e){var t=(e.touches&&e.touches[0])?e.touches[0]:e,r=c.getBoundingClientRect();return[(t.clientX-r.left)*c.width/r.width,(t.clientY-r.top)*c.height/r.height]}
  function st(e){e.preventDefault();dn=true;var p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]+.1);x.stroke();sgHas=true}
  function mv(e){if(!dn)return;e.preventDefault();var p=pt(e);x.lineTo(p[0],p[1]);x.stroke();x.beginPath();x.moveTo(p[0],p[1])}
  function en(){dn=false}
  if(window.PointerEvent){
    c.addEventListener('pointerdown',function(e){try{c.setPointerCapture(e.pointerId)}catch(_){}st(e)});
    c.addEventListener('pointermove',mv);c.addEventListener('pointerup',en);c.addEventListener('pointercancel',en);
  }else{
    c.addEventListener('touchstart',st);c.addEventListener('touchmove',mv);c.addEventListener('touchend',en);
    c.addEventListener('mousedown',st);c.addEventListener('mousemove',mv);c.addEventListener('mouseup',en);
  }
}
function docSignFile(inp){

      var x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
      var id=x.getImageData(0,0,c.width,c.height),p=id.data;
      for(var i=0;i<p.length;i+=4){if(p[i]>225&&p[i+1]>225&&p[i+2]>225)p[i+3]=0}

function prods(){return cobj().prods||[]}
function findProd(name,type){
  var n=String(name||'').trim().toLowerCase();if(!n)return null;
  return prods().find(function(p){return String(p.name).trim().toLowerCase()===n&&(!type||p.type===type)})||null;
}
function histNames(type){
  var m={};
  S.tx.forEach(function(t){
    if(t.type!==type||!t.name)return;var k=String(t.name).trim().toLowerCase();if(!k)return;
    var e=m[k]||(m[k]={name:String(t.name).trim(),n:0,amts:{},cat:t.cat,last:''});
    e.n++;var a=String(t.amt);e.amts[a]=(e.amts[a]||0)+1;if(t.date>=e.last){e.last=t.date;e.cat=t.cat}
  });
  return Object.keys(m).map(function(k){var e=m[k],bp='',bc=0;for(var a in e.amts)if(e.amts[a]>bc){bc=e.amts[a];bp=a}e.price=+bp;return e}).sort(function(a,b){return b.n-a.n});
}
function sugList(type){
  var seen={},out=[];
  prods().filter(function(p){return p.type===type}).forEach(function(p){seen[String(p.name).toLowerCase()]=1;out.push({name:p.name,price:p.price,cat:p.cat,p:p,tag:'สินค้า'})});
  histNames(type).slice(0,40).forEach(function(h){if(seen[h.name.toLowerCase()])return;out.push({name:h.name,price:h.price,cat:h.cat,tag:'เคยบันทึก ×'+h.n})});
  return out;
}

var BS={name:'',raw:null,hi:0,map:{},mode:'split',flip:false,acc:'',tol:1,res:null};
function csvParse(t){
  t=String(t).replace(/^\ufeff/,'');
  var first=t.split(/\r?\n/).slice(0,6).join('\n'),dl=',',bc=-1;
  [',',';','\t','|'].forEach(function(d){var c=first.split(d).length;if(c>bc){bc=c;dl=d}});
  var rows=[],row=[],f='',q=false,i,ch;
  for(i=0;i<t.length;i++){
    ch=t.charAt(i);
    if(q){if(ch==='"'){if(t.charAt(i+1)==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===dl){row.push(f);f=''}
    else if(ch==='\n'){row.push(f);rows.push(row);row=[];f=''}
    else if(ch!=='\r')f+=ch;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function bsNum(v){
  var s=String(v==null?'':v).trim();if(!s)return 0;
  var neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/CR$/i.test(s)&&false;

function bsDate(v){

  if(m=s.match(/(\d{4})[\-\/.](\d{1,2})[\-\/.](\d{1,2})/)){y=+m[1];mo=+m[2];d=+m[3]}
  else if(m=s.match(/(\d{1,2})[\-\/.](\d{1,2})[\-\/.](\d{2,4})/)){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y=y>=50?y+2500:y+2000}

    bsRun();
  }).catch(fail);
}

    '<div class="f"><label>รูปแบบจำนวนเงิน</label><select onchange="BS.mode=this.value;BS.res=null;rBnk()"><option value="split"'+(BS.mode==='split'?' selected':'')+'>แยกคอลัมน์ เงินเข้า / เงินออก</option><option value="single"'+(BS.mode==='single'?' selected':'')+'>คอลัมน์เดียว (+ เข้า, − ออก)</option></select></div>'+
    (BS.mode==='split'?sel('cred','คอลัมน์เงินเข้า')+sel('debit','คอลัมน์เงินออก'):sel('amt','คอลัมน์จำนวนเงิน')+'<label class="eopt"><input type="checkbox" '+(BS.flip?'checked':'')+' onchange="BS.flip=this.checked;BS.res=null;rBnk()"><span>กลับเครื่องหมาย (ถ้าไฟล์ใช้ + เป็นเงินออก)</span></label>')+
    '</div><div class="tw"><table><thead><tr><th>วันที่</th><th>ประเภท</th><th class="r">จำนวน</th><th>รายละเอียด</th></tr></thead><tbody>'+prev+'</tbody></table></div>'+
    '<div class="row" style="margin-top:14px"><div class="f"><label>ยอมให้วันที่ห่างกันได้</label><select onchange="BS.tol=+this.value;BS.res=null;rBnk()"><option value="0"'+(BS.tol===0?' selected':'')+'>วันเดียวกันเท่านั้น</option><option value="1"'+(BS.tol===1?' selected':'')+'>± 1 วัน</option><option value="2"'+(BS.tol===2?' selected':'')+'>± 2 วัน</option><option value="3"'+(BS.tol===3?' selected':'')+'>± 3 วัน</option></select></div><button class="btn" onclick="bsRun()">เทียบกับรายการในระบบ</button></div></div>';
  }
  var res='';
  if(BS.res){
    var R=BS.res,a=S.acc.find(function(x){return x.id===BS.acc});
    var mrows=R.missing.map(function(m,i){return '<tr><td><input type="checkbox" id="bsc'+i+'"'+(isLocked(m.date)?' disabled':' checked')+'></td><td style="white-space:nowrap">'+dth(m.date)+(m.time?'<br><small style="color:var(--mute)">'+m.time+'</small>':'')+'</td><td><span class="tag '+(m.type==='inc'?'i':'e')+'">'+(m.type==='inc'?'เงินเข้า':'เงินออก')+'</span></td><td class="r">'+money(m.amt)+'</td><td><input id="bsn'+i+'" value="'+esc(m.desc||'')+'" placeholder="ชื่อรายการ" style="min-width:160px"></td></tr>'}).join('')||'<tr><td colspan="5" class="empty">ไม่มีรายการที่ขาดหายไป 🎉</td></tr>';
    var aorows=R.appOnly.map(function(t){return '<tr><td>'+dth(t.date)+'</td><td>'+esc(t.name)+'</td><td><span class="tag '+(t.type==='inc'?'i':'e')+'">'+(t.type==='inc'?'รายรับ':'รายจ่าย')+'</span></td><td class="r">'+money(t.amt)+'</td></tr>'}).join('')||'<tr><td colspan="4" class="empty">ไม่มี</td></tr>';
    var morows=R.matched.slice(0,200).map(function(x){return '<tr><td>'+dth(x.s.date)+'</td><td>'+esc(x.t.name)+'</td><td class="r">'+(x.t.type==='inc'?'+':'−')+money(x.s.amt)+'</td></tr>'}).join('');
    res='<div class="box" style="max-width:980px"><h2>3. ผลการเทียบ '+esc(a?a.name:'')+' · '+dth(R.f)+' ถึง '+dth(R.t)+'</h2><div class="rpc"><div class="rpk"><span>รายการใน statement</span><b>'+R.n+'</b></div><div class="rpk"><span>ตรงกัน</span><b class="inc">'+R.matched.length+'</b></div><div class="rpk"><span>มีในธนาคาร ยังไม่ได้บันทึก</span><b class="exp">'+R.missing.length+'</b></div><div class="rpk"><span>บันทึกแล้ว แต่ไม่พบในธนาคาร</span><b class="exp">'+R.appOnly.length+'</b></div></div></div>'+

    '<div class="box" style="max-width:980px"><h2>บันทึกในระบบแล้ว แต่ไม่พบใน statement ('+R.appOnly.length+')</h2><p class="bkst">อาจเป็นรายการที่ยังไม่เข้าบัญชี จำนวนเงินไม่ตรง หรือบันทึกผิดบัญชี ควรตรวจสอบ</p><div class="tw"><table><thead><tr><th>วันที่</th><th>รายการ</th><th>ประเภท</th><th class="r">จำนวน</th></tr></thead><tbody>'+aorows+'</tbody></table></div></div>'+
    (morows?'<details style="max-width:980px;margin-bottom:24px"><summary style="cursor:pointer;color:#2a78b8">ดูรายการที่ตรงกัน ('+R.matched.length+')</summary><div class="box" style="margin-top:10px"><div class="tw"><table><thead><tr><th>วันที่</th><th>รายการ</th><th class="r">จำนวน</th></tr></thead><tbody>'+morows+'</tbody></table></div></div></details>':'');
  }
  $('main').innerHTML='<h1>เทียบ Statement ธนาคาร</h1><p class="sub">อัปโหลดไฟล์ statement (.csv) เพื่อตรวจว่ารายการไหนเงินเข้า/ออกแล้วแต่ยังไม่ได้บันทึก หรือบันทึกแล้วแต่ไม่พบในธนาคาร</p>'+
  '<div class="box" style="max-width:980px"><h2>1. เลือกบัญชีและไฟล์</h2><div class="row"><div class="f"><label>บัญชีที่ต้องการเทียบ</label><select onchange="BS.acc=this.value;BS.res=null;rBnk()"><option value="">— เลือกบัญชี —</option>'+accs+'</select></div><div class="f"><label>ไฟล์ statement (.csv)</label><input type="file" accept=".csv,text/csv,text/plain" onchange="bsFile(this)"></div></div><p class="bkst" style="margin:0">ไฟล์ไม่ถูกอัปโหลดไปที่ไหน อ่านและเทียบในเครื่องคุณเท่านั้น ถ้าธนาคารให้เป็น Excel ให้บันทึกเป็น CSV (UTF-8) ก่อน</p></div>'+map+res;
