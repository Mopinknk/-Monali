<style>
:root{--bg:#fbfcff;--card:#fff;--line:#eef0f7;--text:#4a3f44;--mute:#9a8c92;--dark:#3b2f35;--rose:#d9617f;--rose2:#c24d6c;--soft:#e6f3ff;--inc:#2f86c6;--exp:#d9567a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Sarabun','Noto Sans Thai',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;background:radial-gradient(420px 420px at 100% 0,#ffe3ec 0,transparent 70%),radial-gradient(400px 400px at 0 100%,#dff0ff 0,transparent 70%),radial-gradient(300px 300px at 85% 95%,#e8f4ff 0,transparent 70%)}
.side{position:fixed;left:14px;top:14px;bottom:14px;width:226px;background:var(--card);border-radius:24px;box-shadow:0 4px 24px rgba(90,110,150,.08);padding:28px 14px;z-index:20;overflow-y:auto}
.brand{font-family:'Prompt','Sarabun',sans-serif;font-weight:500;font-size:15px;color:var(--dark);padding:0 12px 24px;line-height:1.35}
.brand{cursor:pointer}.brand .lg{display:block;width:46px;height:46px;border-radius:14px;object-fit:cover;margin-bottom:12px;background:linear-gradient(135deg,#ffb8cf,#a9d6ff)}.side .set{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.brand small{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px;font-family:'Sarabun',sans-serif}
.nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;margin-bottom:4px;border-radius:14px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;transition:all .15s}
.nav button:hover{background:#f3f9ff}

.top{display:none;position:sticky;top:0;z-index:15;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 18px;align-items:center;justify-content:space-between}
.top b{font-size:14px;font-weight:600}
main{margin-left:254px;padding:36px 40px 80px;max-width:1160px;position:relative}
h1{font-family:'Prompt','Sarabun',sans-serif;font-size:24px;font-weight:500;margin:0 0 4px;color:var(--dark)}
.sub{color:var(--mute);margin:0 0 26px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.card{border:0;border-radius:22px;padding:20px 22px;background:#fff;box-shadow:0 4px 20px rgba(90,110,150,.07)}

.card .n{font-size:12px;color:#8a7c83;margin-top:4px}
.inc{color:var(--inc)!important}.exp{color:var(--exp)!important}
.box{background:var(--card);border-radius:24px;padding:24px 26px;margin-bottom:24px;box-shadow:0 4px 24px rgba(90,110,150,.07)}

.f{display:flex;flex-direction:column;gap:5px;min-width:150px}

input,select,textarea{font:inherit;font-size:14px;padding:10px 14px;border:1px solid #e6ecf6;border-radius:14px;background:#fafcff;color:var(--text);width:100%;transition:all .15s}

textarea{resize:vertical;min-height:70px}
.btn{font:inherit;font-size:14px;border:1px solid var(--rose);background:var(--rose);color:#fff;padding:9px 22px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn:hover{background:var(--rose2);border-color:var(--rose2);transform:translateY(-1px)}
.btn.o{background:#fff;color:#2a78b8;border-color:#cfe5f8}

.btn.d{background:#fff;color:var(--exp);border-color:#f8d3df}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f6faff}
th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:#f8fbff}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(74,63,68,.28);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}

.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

main{margin-left:0;padding:20px 14px 60px}
.box{padding:18px 16px;border-radius:20px}

.bnav{display:none}
@media(max-width:700px){

.sub{margin-bottom:16px}
input,select,textarea{font-size:16px;padding:12px 14px}
.btn{min-height:44px;padding:10px 20px}
.btn.s{min-height:38px;padding:6px 14px}
.grid{grid-template-columns:1fr 1fr;gap:10px}

.bnav button{flex:1;border:0;background:none;font:inherit;font-size:13px;color:var(--mute);padding:10px 2px;border-radius:12px;line-height:1.2;margin:0 2px}
.bnav button.on{color:#2a78b8;background:var(--soft);font-weight:600}
table.tx,table.tx tbody{display:block;width:100%}
table.tx thead{display:none}
table.tx tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name amt" "date type" "cat acc" "note note" "act act";gap:3px 12px;padding:12px 2px;border-bottom:1px solid var(--line)}
table.tx tr:last-child{border-bottom:0}
table.tx td{display:block;padding:0;border:0;min-width:0}
table.tx tbody tr:hover td{background:none}
table.tx td:nth-child(1){grid-area:date;color:var(--mute);font-size:13px}
table.tx td:nth-child(1) br{display:none}
table.tx td:nth-child(1) span{margin-left:6px}
table.tx td:nth-child(2){grid-area:name;font-weight:600;color:var(--dark)}
table.tx td:nth-child(3){grid-area:cat;font-size:13px;color:var(--mute)}
table.tx td:nth-child(4){grid-area:type;text-align:right}
table.tx td:nth-child(5){grid-area:amt;text-align:right;font-weight:600;font-size:16px}
table.tx td:nth-child(6){grid-area:acc;text-align:right;font-size:13px}
table.tx td:nth-child(7){grid-area:note;font-size:13px;color:var(--mute)}
table.tx td:nth-child(7):empty{display:none}
table.tx td:nth-child(8){grid-area:act;margin-top:6px}
table.tx td.empty{grid-area:1/1/6/3}
}

/* ---- ปรับปรุง: ฟอร์ม/มือถือ ---- */
.seg{display:flex;gap:6px;background:#f1f5fb;border-radius:14px;padding:4px}

.fx{display:contents}.ftog{display:none}
@media(max-width:700px){
.top .btn{display:none}
.bnav{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
main{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
#toast{bottom:calc(92px + env(safe-area-inset-bottom))}
.frm .two{grid-template-columns:1fr 1fr;gap:12px}
.frm .two .f{min-width:0;margin:0}
.frm .c-ft{order:1;grid-column:1/-1}.frm .c-am{order:2;grid-column:1/-1}.frm .c-nm{order:3;grid-column:1/-1}.frm .c-cg{order:4;grid-column:1/-1}
.frm .c-d{order:5}.frm .c-tm{order:6}.frm .c-ch{order:7}.frm .c-ac{order:8}.frm .c-im{order:9;grid-column:1/-1}
.frm #fm{font-size:24px;font-weight:600;padding:14px;color:var(--dark)}
.seg button{padding:13px 8px;font-size:16px}
.frm .stk{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));background:linear-gradient(to top,#fff 78%,rgba(255,255,255,0));margin:14px -14px -16px;padding:14px 14px 16px;z-index:5;border-radius:0 0 20px 20px;flex-wrap:nowrap}
.frm .stk .btn:first-child{flex:2}
.ftog{display:block;width:100%;margin-top:2px}
.hrow .fx{display:none;width:100%}

.hrow .f[style*="flex:1"]{min-width:100%}
.tw table:not(.tx) th,.tw table:not(.tx) td{padding:10px 8px;font-size:13px}

table.tx td:nth-child(8) .btn{flex:none}
table.tx td:nth-child(8){display:flex;gap:8px}
#scanMsg{font-size:13px;line-height:1.7}
.okb{border-radius:14px}
}
.dupl{margin:8px 0 12px;padding-left:20px;font-size:14px}.dtag{display:inline-block;background:#fff3d6;color:#9a6b00;border-radius:99px;padding:0 8px;font-size:12px}
.wrnb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff6e0;color:#8a6200;border-radius:16px;padding:12px 16px;margin:0 0 16px;font-size:14px}.wrnb a{color:#2a78b8;cursor:pointer;text-decoration:underline;white-space:nowrap}
.bkst{font-size:14px;color:var(--mute);margin:0 0 12px}
</style>
</head>

function fail(e){if(e&&e.message==='NOAUTH')return;console.error(e);var m=String((e&&e.message)||'').slice(0,160);toast('ดำเนินการไม่สำเร็จ'+(m?' : '+m:' ตรวจสอบอินเทอร์เน็ตและการตั้งค่า Supabase'))}
var SES=null,SESKEY='ie_session_v1';
function loadSes(){try{SES=JSON.parse(localStorage.getItem(SESKEY)||'null')}catch(e){SES=null}}
function saveSes(d){SES={access_token:d.access_token,refresh_token:d.refresh_token,exp:Math.floor(Date.now()/1000)+(d.expires_in||3600)};try{localStorage.setItem(SESKEY,JSON.stringify(SES))}catch(e){}}
function auth(path,body){
  return fetch(SB.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){
    return r.json().then(function(j){if(!r.ok)throw new Error(j.error_description||j.msg||j.message||String(r.status));return j});
  });
}
function token(){
  if(!SES)return Promise.reject(new Error('NOAUTH'));
  if(SES.exp-Math.floor(Date.now()/1000)>60)return Promise.resolve(SES.access_token);
  return auth('token?grant_type=refresh_token',{refresh_token:SES.refresh_token}).then(function(d){saveSes(d);return SES.access_token}).catch(function(){logout(true);throw new Error('NOAUTH')});
}
function api(method,path,body,hdr){
  return token().then(function(t){
    var h={apikey:SB.key,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'return=minimal'};
    if(hdr)for(var k in hdr)h[k]=hdr[k];
    return fetch(SB.url+'/rest/v1/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
  }).then(function(r){
    if(r.status===401){logout(true);throw new Error('NOAUTH')}
    if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t)});
    return r.text().then(function(t){return t?JSON.parse(t):null});
  });
}
function showLogin(msg){$('login').style.display='flex';$('lerr').textContent=msg||'';setTimeout(function(){$('le').focus()},50)}
function doLogin(){
  var em=$('le').value.trim(),pw=$('lp').value;
  if(!em||!pw){$('lerr').textContent='กรุณากรอกอีเมลและรหัสผ่าน';return}
  $('lb').disabled=true;$('lerr').textContent='';
  auth('token?grant_type=password',{email:em,password:pw}).then(function(d){
    if(!d.user||d.user.id!==SB.owner)throw new Error('บัญชีนี้ไม่มีสิทธิ์เข้าใช้งาน');
    saveSes(d);$('login').style.display='none';$('lp').value='';startApp();
  }).catch(function(e){$('lerr').textContent=e.message==='Invalid login credentials'?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':e.message}).then(function(){$('lb').disabled=false});
}
function logout(silent){
  SES=null;try{localStorage.removeItem(SESKEY);localStorage.removeItem(KEY)}catch(e){}
  S={shop:{name:'',logo:''},acc:[],tx:[]};
  $('side').classList.remove('open');closeM();
  showLogin(silent===true?'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่':'');
}
function getAll(path){
  var out=[];
  function pg(o){return api('GET',path+'&limit=1000&offset='+o).then(function(r){r=r||[];out=out.concat(r);return r.length===1000?pg(o+1000):out})}
  return pg(0);
}
function fromAcc(r){return{id:r.id,ch:r.channel,name:r.name,open:Number(r.opening_balance)}}
function fromTx(r){return{id:r.id,date:r.tx_date,type:r.type,name:r.name,cat:r.category,amt:Number(r.amount),note:r.note||'',ch:r.channel,acc:r.account_id,hasImg:!!r.has_image,time:(r.tx_time||'').slice(0,5)}}
function pull(){
  return Promise.all([
    api('GET','shop_settings?select=name,logo'),
    getAll('accounts?select=*&order=created_at.asc,id.asc'),
    getAll('transactions?select=id,tx_date,tx_time,type,name,category,amount,note,channel,account_id,has_image&order=tx_date.desc,created_at.desc,id.asc').then(function(x){hasTime=true;return x}).catch(function(e){if(e&&e.message==='NOAUTH')throw e;hasTime=false;return getAll('transactions?select=id,tx_date,type,name,category,amount,note,channel,account_id,has_image&order=tx_date.desc,created_at.desc,id.asc')}),
    api('GET','shop_settings?select=categories').catch(function(){return null})
  ]).then(function(r){
    var sh=(r[0]&&r[0][0])||{};
    var cc=r[3]&&r[3][0]&&r[3][0].categories;
    S={shop:{name:sh.name||'',logo:sh.logo||''},acc:r[1].map(fromAcc),tx:r[2].map(fromTx),cats:cc||(S&&S.cats)||null};
    applyCats();cache();
  });
}

function chBal(ch){return S.acc.filter(function(a){return a.ch===ch}).reduce(function(x,a){return x+accBal(a).bal},0)}
function accName(id){var a=S.acc.find(function(x){return x.id===id});return a?a.name:'-'}

function pickLogo(inp){
  var f=inp.files[0];if(!f)return;
  if(f.type.indexOf('image/')!==0){toast('กรุณาเลือกไฟล์รูปภาพ');inp.value='';return}
  var r=new FileReader();
  r.onload=function(e){
    var im=new Image();
    im.onload=function(){
      var k=Math.min(1,256/Math.max(im.width,im.height));
      var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      tmpLogo=c.toDataURL('image/webp',0.85);showLogo();
    };
    im.onerror=function(){toast('เปิดรูปภาพไม่ได้')};
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}

function addCat(t){
  var el=$('nc_'+t),v=el.value.trim();
  if(!v){toast('กรุณากรอกชื่อหมวดหมู่');return}
  if(INCC.concat(EXPC).indexOf(v)>=0){toast('มีหมวดหมู่ชื่อนี้อยู่แล้ว');return}
  catList(t).push(v);
  saveCats().then(function(){toast('เพิ่มหมวดหมู่แล้ว');rCats()}).catch(function(e){catList(t).pop();S.cats=catsObj();catErr(e);rCats()});

var renCtx=null;
function renCat(t,i){
  renCtx={t:t,i:i};
  modal('<h3>แก้ไขชื่อหมวดหมู่</h3><div class="f"><label>ชื่อหมวดหมู่</label><input id="rc" value="'+esc(catList(t)[i])+'" onkeydown="if(event.key===\'Enter\')doRenCat()"></div><div class="acts"><button class="btn o" onclick="closeM()">ยกเลิก</button><button class="btn" onclick="doRenCat()">บันทึก</button></div>');
  setTimeout(function(){$('rc').focus()},50);
}
function doRenCat(){
  var t=renCtx.t,i=renCtx.i,L=catList(t),old=L[i],v=$('rc').value.trim();
  if(!v){toast('กรุณากรอกชื่อหมวดหมู่');return}
  if(v===old){closeM();return}
  if(INCC.concat(EXPC).indexOf(v)>=0){toast('มีหมวดหมู่ชื่อนี้อยู่แล้ว');return}
  L[i]=v;ntRename(t,old,v);
  var used=S.tx.some(function(x){return x.type===t&&x.cat===old});
  saveCats().then(function(){
    if(!used)return;
    return api('PATCH','transactions?type=eq.'+t+'&category=eq.'+encodeURIComponent(old),{category:v}).then(function(){S.tx.forEach(function(x){if(x.type===t&&x.cat===old)x.cat=v})});
  }).then(function(){cache();closeM();toast('แก้ไขหมวดหมู่แล้ว');rCats()}).catch(function(e){L[i]=old;ntRename(t,v,old);S.cats=catsObj();closeM();catErr(e)});
}
function delCat(t,i){
  var L=catList(t),c=L[i];
  if(L.length<2){toast('ต้องมีหมวดหมู่อย่างน้อย 1 รายการ');return}
  var n=S.tx.filter(function(x){return x.type===t&&x.cat===c}).length;
  confirmBox('ลบหมวดหมู่ “'+esc(c)+'” ?'+(n?'<br>มี '+n+' รายการที่ใช้หมวดหมู่นี้ รายการเดิมจะยังคงอยู่และยังแสดงชื่อหมวดหมู่เดิม':''),function(){
    L.splice(i,1);
    saveCats().then(function(){toast('ลบหมวดหมู่แล้ว');rCats()}).catch(function(e){L.splice(i,0,c);S.cats=catsObj();catErr(e);rCats()});
  });
}


/* ---------- ที่เก็บรูป (Supabase Storage, bucket: slips) ---------- */
function stHdr(t,extra){var h={apikey:SB.key,Authorization:'Bearer '+t};if(extra)for(var k in extra)h[k]=extra[k];return h}
function stCheck(r){if(r.status===401){logout(true);throw new Error('NOAUTH')}if(!r.ok)return r.text().then(function(t){throw new Error('storage '+r.status+' '+t)});return r}
function stUpload(path,dataUrl){
  return Promise.all([token(),fetch(dataUrl).then(function(r){return r.blob()})]).then(function(a){
    return fetch(SB.url+'/storage/v1/object/slips/'+path,{method:'POST',headers:stHdr(a[0],{'Content-Type':'image/jpeg','x-upsert':'true'}),body:a[1]});
  }).then(stCheck).then(function(){return path});
}
function stDelete(path){return token().then(function(t){return fetch(SB.url+'/storage/v1/object/slips/'+path,{method:'DELETE',headers:stHdr(t)})}).catch(function(){})}
function blobToDataUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}
/* ค่าในคอลัมน์ image: data:... = รูปเก่าในฐานข้อมูล, อย่างอื่น = path ใน Storage */
function resolveImg(v){
  if(!v)return Promise.resolve('');
  if(v.indexOf('data:')===0)return Promise.resolve(v);
  if(v.indexOf('r2:')===0){if(!r2On())return Promise.reject(new Error('ยังไม่ได้ตั้งค่า R2_URL'));return r2Req('GET',v.slice(3)).then(function(r){return r.blob()}).then(blobToDataUrl)}
  return token().then(function(t){return fetch(SB.url+'/storage/v1/object/authenticated/slips/'+v,{headers:stHdr(t)})}).then(stCheck).then(function(r){return r.blob()}).then(blobToDataUrl);
}

function r2On(){return !!R2_URL}
function r2Req(method,key,body){
  return token().then(function(t){return fetch(R2_URL.replace(/\/+$/,'')+'/img/'+key,{method:method,headers:{Authorization:'Bearer '+t,apikey:SB.key},body:body})}).then(stCheck);
}
function r2Put(id,dataUrl){return fetch(dataUrl).then(function(r){return r.blob()}).then(function(b){return r2Req('PUT',id+'.jpg',b)}).then(function(){return 'r2:'+id+'.jpg'})}
/* หลายรูปต่อรายการ (สูงสุด 3): รูปที่ 1 ใช้ชื่อ id เดิม, รูปที่ 2-3 ใช้ id_2 / id_3 ; คอลัมน์ image เก็บเป็นค่าเดียว (เหมือนเดิม) หรือ JSON array เมื่อมีมากกว่า 1 รูป */
function imgName(id,i){return i?uid():id}
var oldImgVals=[];
function delStored(v){if(!v||v.indexOf('data:')===0)return;if(v.indexOf('r2:')===0){var k=v.slice(3);if(r2On())r2Req('DELETE',k).catch(function(){});stDelete(k)}else stDelete(v)}
function parseImgVals(v){if(!v)return[];if(v.charAt(0)==='['){try{var a=JSON.parse(v);return Array.isArray(a)?a.filter(Boolean):[]}catch(e){return[]}}return[v]}
function resolveImgs(v){return Promise.all(parseImgVals(v).map(resolveImg))}
function putImgs(id,arr){return Promise.all(arr.map(function(d,i){return putImg(imgName(id,i),d)})).then(function(vals){return vals.length===1?vals[0]:JSON.stringify(vals)})}
/* เก็บรูป: ใช้ R2 ถ้าตั้งค่าแล้ว ไม่งั้นใช้ Supabase Storage; คืนค่าที่จะเก็บในคอลัมน์ image */
function putImg(id,dataUrl){
  if(r2On())return r2Put(id,dataUrl).then(function(v){stDelete(id+'.jpg');return v});
  return stUpload(id+'.jpg',dataUrl);
}
function delImg(id){if(r2On())r2Req('DELETE',id+'.jpg').catch(function(){});stDelete(id+'.jpg')}
var migRun=false;
function migrateImgs(){
  if(migRun)return;migRun=true;
  var done=0,fails=0;
  var flt=r2On()?'image=not.is.null&image=neq.&image=not.like.r2:*&image=not.like.[*':'image=like.data:*';
  function msg(m){var el=$('migmsg');if(el)el.textContent=m}
  function step(){
    api('GET','transactions?select=id&'+flt+'&limit=10').then(function(rows){
      rows=rows||[];
      if(!rows.length){migRun=false;msg('ย้ายเสร็จแล้ว '+done+' รูป'+(fails?' (ไม่สำเร็จ '+fails+')':''));return}
      return Promise.all(rows.map(function(r){
        return api('GET','transactions?id=eq.'+r.id+'&select=image').then(function(x){
          var old=x&&x[0]&&x[0].image;if(!old)return;
          return resolveImg(old).then(function(img){return putImg(r.id,img)}).then(function(path){return api('PATCH','transactions?id=eq.'+r.id,{image:path})}).then(function(){done++});
        }).catch(function(e){fails++;console.error(e)});
      })).then(function(){
        msg('กำลังย้ายรูป... สำเร็จ '+done+' รูป'+(fails?' (ไม่สำเร็จ '+fails+')':''));
        if(fails>0&&done===0){migRun=false;msg('ย้ายไม่สำเร็จ ตรวจสอบการตั้งค่า Worker/R2 หรือ bucket แล้วลองใหม่');return}
        if(fails>=10){migRun=false;msg('หยุดย้ายเพราะมีรูปที่ย้ายไม่สำเร็จ '+fails+' รูป (สำเร็จ '+done+')');return}
        step();
      });
    }).catch(function(e){migRun=false;msg('ผิดพลาด: '+String((e&&e.message)||e).slice(0,160))});
  }
  msg('เริ่มย้ายรูป...');step();
}


/* ---------- ชื่อผู้รับที่ถือเป็นรายรับ ---------- */
function cleanNm(x){return String(x||'').replace(/^(นางสาว|น\.ส\.|นส\.|นาย|นาง|คุณ|mr\.?|mrs\.?|ms\.?|miss)\s*/i,'').replace(/\s+/g,' ').trim().slice(0,60)}
function nmKey(x){return cleanNm(x).toLowerCase().replace(/[^a-zก-๙]/g,'')}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));return d[m][n]}
function sameName(a,b){
  a=nmKey(a);b=nmKey(b);
  if(a.length<3||b.length<3)return false;
  if(a.indexOf(b)>-1||b.indexOf(a)>-1)return true;
  return lev(a,b)/Math.max(a.length,b.length)<=0.25;
}
function isIncRecv(p){
  var L=rnames();
  return (p.recvC||[]).some(function(c){return L.some(function(n){return sameName(n,c)})});
}
function addRecvName(n){
  n=cleanNm(n);if(!n||nmKey(n).length<3)return;
  if(rnames().some(function(x){return sameName(x,n)}))return;
  var rn=rnames().concat([n]);
  rnSaveLocal(rn);S.cats=catsObj(rn);
  saveCats().catch(function(e){if(e&&e.message==='NOAUTH')return;console.error(e);toast('จำชื่อผู้รับไว้ในเครื่องนี้แล้ว แต่บันทึกขึ้นระบบไม่สำเร็จ')});
}

  return '<div class="box" style="max-width:720px"><h2>ชื่อผู้รับในสลิปที่ถือเป็นรายรับ</h2><p class="sub" style="margin-bottom:12px">ถ้าสลิปที่สแกนมีชื่อผู้รับตรงกับรายการนี้ ระบบจะตั้งประเภทเป็น “รายรับ” ให้อัตโนมัติ ชื่อจะถูกจำเองเมื่อคุณบันทึกสลิปเป็นรายรับ หรือจะเพิ่มเองตรงนี้ก็ได้</p><div class="tw"><table><tbody>'+rows+'</tbody></table></div><div class="row" style="margin-top:12px;gap:8px"><input id="nrn" placeholder="ชื่อผู้รับตามที่แสดงในสลิป" style="flex:1" onkeydown="if(event.key===\'Enter\')addRn()"><button class="btn s" onclick="addRn()">เพิ่มชื่อ</button></div></div>';

function addRn(){
  var v=cleanNm($('nrn').value);
  if(nmKey(v).length<3){toast('กรุณากรอกชื่ออย่างน้อย 3 ตัวอักษร');return}
  if(rnames().some(function(x){return sameName(x,v)})){toast('มีชื่อนี้อยู่แล้ว');return}
  var old=rnames().slice(),nw=old.concat([v]);

}
function delRn(i){
  var old=rnames().slice(),rn=old.slice();rn.splice(i,1);
  rnSaveLocal(rn);S.cats=catsObj(rn);
  saveCats().then(function(){toast('ลบชื่อแล้ว');rCats()}).catch(function(e){rnSaveLocal(old);S.cats=catsObj(old);catErr(e);rCats()});

function scanSlip(inp){
  var f=inp.files[0];if(!f)return;
  if(f.type.indexOf('image/')!==0){say('กรุณาเลือกไฟล์รูปภาพ');inp.value='';return}
  say('กำลังเตรียมรูป...');inp.disabled=true;
  var r=new FileReader();
  r.onerror=function(){say('อ่านไฟล์ไม่ได้');inp.disabled=false};
  r.onload=function(e){
    var im=new Image();
    im.onerror=function(){say('เปิดรูปภาพไม่ได้');inp.disabled=false};
    im.onload=function(){
      var k=Math.min(1,800/Math.max(im.width,im.height));
      var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      formImgs.unshift(c.toDataURL('image/jpeg',0.7));if(formImgs.length>MAXIMG){formImgs.length=MAXIMG;toast('แนบครบ '+MAXIMG+' รูปแล้ว ระบบแทนที่รูปสุดท้ายด้วยสลิปที่สแกน')}imgTouched=true;if($('prev'))showPrev();
      var mx=Math.max(im.width,im.height),k2=mx<1400?1400/mx:Math.min(1,2000/mx);
      var o=document.createElement('canvas');o.width=Math.round(im.width*k2);o.height=Math.round(im.height*k2);
      var y=o.getContext('2d');y.fillStyle='#fff';y.fillRect(0,0,o.width,o.height);y.filter='grayscale(1) contrast(1.35)';y.drawImage(im,0,0,o.width,o.height);
      var worker;
      say('กำลังโหลดตัวอ่านสลิป (ครั้งแรกอาจใช้เวลาสักครู่ ต้องเชื่อมต่ออินเทอร์เน็ต)...');
      loadTess().then(function(){
        return Tesseract.createWorker('tha+eng',1,{logger:function(m){if(m.status==='recognizing text')say('กำลังอ่านสลิป '+Math.round(m.progress*100)+'%')}});
      }).then(function(w){worker=w;return w.recognize(o)})
      .then(function(res){return worker.terminate().then(function(){return res})})
      .then(function(res){lastOcr=res.data.text||'';applySlip(parseSlip(lastOcr))})
      .catch(function(err){
        console.error(err);
        say((err&&err.message==='LOAD'?'โหลดตัวอ่านสลิปไม่สำเร็จ ต้องเชื่อมต่ออินเทอร์เน็ต':'อ่านสลิปไม่สำเร็จ')+' กรุณากรอกข้อมูลเอง (แนบรูปสลิปไว้แล้ว)');
      }).then(function(){inp.disabled=false;inp.value=''});
    };
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}

function loadExpImgs(L){
  var ids=L.filter(function(t){return t.hasImg}).map(function(t){return t.id}),M={},done=0,pending=[],groups=[];

  prog();
  return groups.reduce(function(p,g){
    return p.then(function(){return api('GET','transactions?select=id,image&id=in.('+g.join(',')+')')}).then(function(rows){(rows||[]).forEach(function(r){pending.push(r)})});
  },Promise.resolve()).then(function(){
    var idx=0;
    function worker(){
      if(idx>=pending.length)return Promise.resolve();
      var r=pending[idx++];
      return resolveImgs(r.image).then(function(ims){M[r.id]=ims}).catch(function(e){if(e&&e.message==='NOAUTH')throw e;console.error(e);expFail++;M[r.id]=[]}).then(function(){done++;prog();return worker()});

  });
}

  var t0=Date.now();(function wait(){var ims=f.contentWindow.document.images,ok=true;for(var k=0;k<ims.length;k++)if(!ims[k].complete)ok=false;var el=Date.now()-t0;if((ok&&el>700)||el>12000){f.contentWindow.focus();f.contentWindow.print();setTimeout(function(){f.remove()},60000)}else setTimeout(wait,200)})();
}
function loadExcelJS(){

  return exjsP;

function imgDims(src){return new Promise(function(res){var im=new Image();im.onload=function(){res({w:im.width||3,h:im.height||4})};im.onerror=function(){res({w:3,h:4})};im.src=src})}
/* Excel แบบมีรูปสลิป (ใช้ ExcelJS เพราะ SheetJS ฝังรูปไม่ได้) */

    var wb=new ExcelJS.Workbook(),w1=wb.addWorksheet('สรุปยอด'),w2=wb.addWorksheet('รายการ');

    [28,26,16,16].forEach(function(w,k){w1.getColumn(k+1).width=w});
    w1.getRow(7).font={bold:true};
    [12,30,30,10,14,18,28,30,22,22,22].forEach(function(w,k){w2.getColumn(k+1).width=w});
    w2.addRow(['วันที่','รายการ','หมวดหมู่','ประเภท','จำนวนเงิน','ช่องทาง','บัญชี','หมายเหตุ','สลิปที่ 1','สลิปที่ 2','สลิปที่ 3']).font={bold:true};
    var TH=120,MW=150,jobs=[];

        }));
      });
    });
    return Promise.all(jobs).then(function(){return wb.xlsx.writeBuffer()});
  }).then(function(buf){
    var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='รายรับรายจ่าย_'+(E.ch==='all'?'ภาพรวม':E.ch)+'_มีสลิป_'+today()+'.xlsx';
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
    expDone();toast('ส่งออก Excel (มีรูปสลิป) แล้ว');
  }).catch(function(e){expDone();if(e&&e.message==='LOAD')toast('โหลดไลบรารี Excel ไม่สำเร็จ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่');else fail(e)});
}

/* ---------- สำรองข้อมูล ---------- */
var BKEY='ie_backups_v1',BFILE='ie_last_file_backup_v1',BMAX=6,rsData=null,bkRun=false;
function bkList(){try{var a=JSON.parse(localStorage.getItem(BKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function bkStore(L){while(L.length){try{localStorage.setItem(BKEY,JSON.stringify(L));return true}catch(e){L.shift()}}return false}
function snapData(){return{app:'ie-tracker-backup',v:1,at:new Date().toISOString(),shop:{name:S.shop.name},cats:S.cats||null,acc:S.acc,tx:S.tx}}
/* mode: auto = ไม่เกิน 1 ครั้ง/6 ชม. · event = ไม่เกิน 1 ครั้ง/2 นาที (ก่อนลบ) · hard = ทุกครั้ง */
function autoSnap(reason,mode){
  try{
    if(!S||!S.tx||(!S.tx.length&&!S.acc.length))return;
    var L=bkList(),last=L[L.length-1],gap=last?Date.now()-new Date(last.at).getTime():1e12;
    if(mode==='auto'&&gap<6*3600*1000)return;
    if(mode==='event'&&gap<120000)return;
    var d=snapData();d.reason=reason||'อัตโนมัติ';
    L.push(d);while(L.length>BMAX)L.shift();
    bkStore(L);
  }catch(e){}
}
function bkStamp(iso){var d=new Date(iso);return dth(d.toLocaleDateString('sv-SE'))+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+' น.'}
function bkLastFile(){try{return localStorage.getItem(BFILE)||''}catch(e){return''}}
function bkNotice(){
  if(!S||!S.tx||!S.tx.length)return'';
  var l=bkLastFile(),days=l?Math.floor((Date.now()-new Date(l).getTime())/86400000):-1;
  if(l&&days<7)return'';
  return'<div class="wrnb"><span><b>เตือนสำรองข้อมูล</b> '+(l?'ผ่านมา '+days+' วันแล้วที่ยังไม่ได้ดาวน์โหลดไฟล์สำรอง':'ยังไม่เคยดาวน์โหลดไฟล์สำรองข้อมูลเก็บไว้')+'</span><a onclick="go(\'bak\')">ไปหน้าสำรองข้อมูล</a></div>';
}
function bkDownload(d,name){
  var b=new Blob([JSON.stringify(d)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(u)},4000);
}
function bkFileName(iso){var d=new Date(iso||Date.now());return 'backup_income-expense_'+d.toLocaleDateString('sv-SE')+'_'+('0'+d.getHours()).slice(-2)+('0'+d.getMinutes()).slice(-2)+'.json'}
function bkMsg(m){var el=$('bkmsg');if(el)el.textContent=m||''}
function bkFile(){
  if(bkRun)return;bkRun=true;bkMsg('กำลังดึงข้อมูลล่าสุดจากระบบ...');
  pull().then(function(){
    bkMsg('กำลังรวบรวมรูปแนบ...');
    var d=snapData();d.shop={name:S.shop.name,logo:S.shop.logo};d.reason='ไฟล์สำรอง';d.img={};
    return getAll('transactions?select=id,image&has_image=eq.true&order=id.asc').then(function(r){
      r.forEach(function(x){if(x.image)d.img[x.id]=x.image});d.imgOk=true;return d;
    }).catch(function(e){if(e&&e.message==='NOAUTH')throw e;d.imgOk=false;return d});
  }).then(function(d){
    bkDownload(d,bkFileName(d.at));
    try{localStorage.setItem(BFILE,new Date().toISOString())}catch(e){}
    autoSnap('ดาวน์โหลดไฟล์สำรอง','event');
    toast('ดาวน์โหลดไฟล์สำรองแล้ว ('+d.tx.length+' รายการ)'+(d.imgOk?'':' · รูปแนบไม่ถูกรวมในไฟล์'),4500);
    bkRun=false;if(view==='bak')rBak();
  }).catch(function(e){bkRun=false;bkMsg('');fail(e)});
}
function rBak(){
  var L=bkList().map(function(d,i){return{d:d,i:i}}).reverse(),lf=bkLastFile();
  var rows=L.map(function(x){var d=x.d;return '<tr><td>'+bkStamp(d.at)+'</td><td>'+esc(d.reason||'')+'</td><td class="r">'+d.acc.length+'</td><td class="r">'+d.tx.length+'</td><td style="white-space:nowrap"><button class="btn o s" onclick="rsSnap('+x.i+')">กู้คืนจุดนี้</button> <button class="btn o s" onclick="bkSnapDl('+x.i+')">ดาวน์โหลด</button></td></tr>'}).join('')||'<tr><td colspan="5" class="empty">ยังไม่มีจุดสำรองอัตโนมัติ (จะสร้างให้เองเมื่อเปิดระบบและมีข้อมูล)</td></tr>';
  $('main').innerHTML='<h1>สำรองข้อมูล</h1><p class="sub">ป้องกันข้อมูลหาย: ดาวน์โหลดไฟล์เก็บไว้เอง และมีจุดสำรองอัตโนมัติในเครื่องนี้</p>'+
  '<div class="box" style="max-width:820px"><h2>1. ดาวน์โหลดไฟล์สำรอง</h2><p class="bkst">'+(lf?'ดาวน์โหลดล่าสุด: '+bkStamp(lf):'ยังไม่เคยดาวน์โหลดไฟล์สำรอง')+' · ข้อมูลตอนนี้: '+S.acc.length+' บัญชี, '+S.tx.length+' รายการ</p><p style="margin:0 0 12px">ไฟล์ .json มีบัญชี รายการทั้งหมด หมวดหมู่ และตำแหน่งรูปสลิป (ตัวรูปจริงยังอยู่ที่ที่เก็บรูป) แนะนำให้ดาวน์โหลดอย่างน้อยสัปดาห์ละครั้งและเก็บไว้ที่ Google Drive หรือในเครื่องอื่น</p><button class="btn" onclick="bkFile()">ดาวน์โหลดไฟล์สำรองตอนนี้</button><div id="bkmsg" class="bkst" style="margin-top:10px"></div></div>'+
  '<div class="box" style="max-width:820px"><h2>2. จุดสำรองอัตโนมัติในเครื่องนี้</h2><p class="bkst">ระบบเก็บให้อัตโนมัติสูงสุด '+BMAX+' จุด (ทุก 6 ชั่วโมงที่ใช้งาน และก่อนลบรายการ/บัญชี/กู้คืน) เก็บในเบราว์เซอร์นี้ ไม่รวมรูป</p><div class="tw"><table><thead><tr><th>เวลา</th><th>สาเหตุ</th><th class="r">บัญชี</th><th class="r">รายการ</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
  '<div class="box" style="max-width:820px"><h2>3. กู้คืนจากไฟล์สำรอง</h2><p class="bkst">การกู้คืนจะ “เพิ่ม/อัปเดต” ข้อมูลตามไฟล์ ไม่ลบรายการอื่นที่มีอยู่ตอนนี้ และระบบจะสร้างจุดสำรองไว้ก่อนเสมอ</p><div class="f" style="max-width:360px"><input type="file" accept=".json,application/json" onchange="bkPick(this)"></div></div>';
}
function bkSnapDl(i){var d=bkList()[i];if(!d)return;bkDownload(d,bkFileName(d.at))}
function bkPick(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){var d=null;try{d=JSON.parse(r.result)}catch(e){}inp.value='';if(!d){toast('อ่านไฟล์ไม่ได้ กรุณาเลือกไฟล์ .json ที่สำรองจากระบบนี้');return}rsAsk(d)};
  r.readAsText(f);
}
function rsSnap(i){var d=bkList()[i];if(d)rsAsk(d)}
function rsAsk(d){
  if(!(d&&d.app==='ie-tracker-backup'&&Array.isArray(d.acc)&&Array.isArray(d.tx))){toast('ไม่ใช่ไฟล์สำรองของระบบนี้');return}
  rsData=d;
  var have={};S.tx.forEach(function(t){have[t.id]=1});
  var add=d.tx.filter(function(t){return !have[t.id]}).length,same=d.tx.length-add;
  modal('<h3>ยืนยันการกู้คืนข้อมูล</h3><p>สำรองเมื่อ <b>'+(d.at?bkStamp(d.at):'-')+'</b><br>มี '+d.acc.length+' บัญชี, '+d.tx.length+' รายการ</p><ul class="dupl"><li>รายการที่ยังไม่มีในระบบ (จะเพิ่มให้): <b>'+add+'</b></li><li>รายการที่มีอยู่แล้ว (จะอัปเดตตามไฟล์): <b>'+same+'</b></li><li>ไม่มีการลบรายการอื่นที่มีอยู่ตอนนี้</li></ul><div class="acts"><button class="btn o" onclick="rsData=null;closeM()">ยกเลิก</button><button class="btn" onclick="rsRun()">ยืนยันกู้คืน</button></div>');
}
function rsChunk(a,n){var o=[];for(var i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o}
function rsUnion(a,b){var o=(a||[]).slice();(b||[]).forEach(function(x){if(o.indexOf(x)<0)o.push(x)});return o}
function rsRun(){
  var d=rsData;if(!d||bkRun)return;closeM();bkRun=true;
  autoSnap('ก่อนกู้คืน','hard');
  var okTx=0,skip=0,accs=d.acc.filter(function(a){return a&&a.id&&a.name}).map(function(a){return{id:a.id,channel:a.ch,name:a.name,opening_balance:+a.open||0}});
  var withImg=[],noImg=[];
  d.tx.forEach(function(t){
    if(!t||!t.id||!/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')||(t.type!=='inc'&&t.type!=='exp')||!t.acc||!(+t.amt>0)){skip++;return}
    var row={id:t.id,tx_date:t.date,type:t.type,name:t.name||'',category:t.cat,amount:+t.amt,note:t.note||'',channel:t.ch,account_id:t.acc};
    if(hasTime)row.tx_time=t.time||null;
    var im=d.img&&d.img[t.id];if(im){row.image=im;withImg.push(row)}else noImg.push(row);okTx++;
  });
  var jobs=[];
  rsChunk(accs,100).forEach(function(c){jobs.push(['accounts',c])});
  rsChunk(noImg,200).forEach(function(c){jobs.push(['transactions',c])});
  rsChunk(withImg,10).forEach(function(c){jobs.push(['transactions',c])});
  var H={Prefer:'resolution=merge-duplicates,return=minimal'},n=0;
  function step(){
    if(n>=jobs.length)return Promise.resolve();
    bkMsg('กำลังกู้คืน '+(n+1)+' / '+jobs.length+' ...');
    var j=jobs[n++];return api('POST',j[0]+'?on_conflict=id',j[1],H).then(step);
  }
  step().then(function(){
    if(!d.cats)return;
    var c=S.cats||{},m={inc:rsUnion(INCC,d.cats.inc),exp:rsUnion(EXPC,d.cats.exp),rn:rsUnion(c.rn,d.cats.rn),nt:rsUnion(c.nt,d.cats.nt)};
    var nm=S.shop.name||(d.shop&&d.shop.name)||'';
    return api('POST','shop_settings?on_conflict=owner_id',{owner_id:SB.owner,name:nm,logo:S.shop.logo||'',categories:m},{Prefer:'resolution=merge-duplicates,return=minimal'});
  }).then(function(){return pull()}).then(function(){
    bkRun=false;rsData=null;toast('กู้คืนข้อมูลสำเร็จ '+okTx+' รายการ'+(skip?' (ข้าม '+skip+' รายการที่ข้อมูลไม่ครบ)':''),5000);render();
  }).catch(function(e){bkRun=false;bkMsg('');fail(e)});
}
