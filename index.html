<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบบันทึกรายรับ-รายจ่าย</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fbfcff;--card:#fff;--line:#eef0f7;--text:#4a3f44;--mute:#9a8c92;--dark:#3b2f35;--rose:#d9617f;--rose2:#c24d6c;--soft:#e6f3ff;--inc:#2f86c6;--exp:#d9567a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Sarabun','Noto Sans Thai',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px 420px at 100% 0,#ffe3ec 0,transparent 70%),radial-gradient(400px 400px at 0 100%,#dff0ff 0,transparent 70%),radial-gradient(300px 300px at 85% 95%,#e8f4ff 0,transparent 70%)}
.side{position:fixed;left:14px;top:14px;bottom:14px;width:226px;background:var(--card);border-radius:24px;box-shadow:0 4px 24px rgba(90,110,150,.08);padding:28px 14px;z-index:20;overflow-y:auto}
.brand{font-family:'Prompt','Sarabun',sans-serif;font-weight:500;font-size:15px;color:var(--dark);padding:0 12px 24px;line-height:1.35}
.brand{cursor:pointer}.brand .lg{display:block;width:46px;height:46px;border-radius:14px;object-fit:cover;margin-bottom:12px;background:linear-gradient(135deg,#ffb8cf,#a9d6ff)}.side .set{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.brand small{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px;font-family:'Sarabun',sans-serif}
.nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;margin-bottom:4px;border-radius:14px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;transition:all .15s}
.nav button:hover{background:#f3f9ff}
.nav button.on{background:var(--soft);color:#2a78b8;font-weight:600}
.top{display:none;position:sticky;top:0;z-index:15;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 18px;align-items:center;justify-content:space-between}
.top b{font-size:14px;font-weight:600}
main{margin-left:254px;padding:36px 40px 80px;max-width:1160px;position:relative}
h1{font-family:'Prompt','Sarabun',sans-serif;font-size:24px;font-weight:500;margin:0 0 4px;color:var(--dark)}
.sub{color:var(--mute);margin:0 0 26px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.card{border:0;border-radius:22px;padding:20px 22px;background:#fff;box-shadow:0 4px 20px rgba(90,110,150,.07)}
.grid .card:nth-child(1){background:#e3f2ff}
.grid .card:nth-child(2){background:#ffe8ef}
.grid .card:nth-child(3){background:#d9ecfb}
.grid .card:nth-child(4){background:#ffdde8}
.card .l{color:#7d6f76;font-size:13px}
.card .v{font-family:'Prompt','Sarabun',sans-serif;font-size:26px;font-weight:500;margin-top:6px;color:var(--dark)}
.card .n{font-size:12px;color:#8a7c83;margin-top:4px}
.inc{color:var(--inc)!important}.exp{color:var(--exp)!important}
.box{background:var(--card);border-radius:24px;padding:24px 26px;margin-bottom:24px;box-shadow:0 4px 24px rgba(90,110,150,.07)}
.box h2{font-family:'Prompt','Sarabun',sans-serif;font-size:16px;font-weight:500;margin:0 0 16px;color:var(--dark)}
main>.row{background:var(--card);border-radius:22px;padding:16px 20px;box-shadow:0 4px 20px rgba(90,110,150,.07);margin-bottom:20px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:18px}
.f{display:flex;flex-direction:column;gap:5px;min-width:150px}
.f label{font-size:12px;color:var(--mute);padding-left:4px}
input,select,textarea{font:inherit;font-size:14px;padding:10px 14px;border:1px solid #e6ecf6;border-radius:14px;background:#fafcff;color:var(--text);width:100%;transition:all .15s}
input[type=file]{padding:8px 10px;font-size:13px}
input:focus,select:focus,textarea:focus{outline:0;border-color:#8ec5f0;box-shadow:0 0 0 4px #e3f2ff}
textarea{resize:vertical;min-height:70px}
.btn{font:inherit;font-size:14px;border:1px solid var(--rose);background:var(--rose);color:#fff;padding:9px 22px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn:hover{background:var(--rose2);border-color:var(--rose2);transform:translateY(-1px)}
.btn.o{background:#fff;color:#2a78b8;border-color:#cfe5f8}
.btn.o:hover{background:var(--soft);border-color:#8ec5f0}
.btn.d{background:#fff;color:var(--exp);border-color:#f8d3df}
.btn.d:hover{background:#fff0f4}
.btn.s{padding:4px 14px;font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f6faff}
th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:#f8fbff}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;font-size:12px;background:#eef1f7;color:var(--mute)}
.tag.i{background:#e0f0fd;color:var(--inc)}
.tag.e{background:#ffe6ee;color:var(--exp)}
.empty{text-align:center;color:var(--mute);padding:36px 0}
.thumb{width:38px;height:38px;object-fit:cover;border-radius:10px;cursor:pointer;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.ov{position:fixed;inset:0;background:rgba(74,63,68,.28);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.md{background:#fff;border-radius:26px;box-shadow:0 16px 48px rgba(80,50,60,.18);padding:28px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.md h3{font-family:'Prompt','Sarabun',sans-serif;margin:0 0 18px;font-size:17px;font-weight:500}
.md .f{margin-bottom:14px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 22px;border-radius:99px;z-index:60;display:none;max-width:90vw;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.prev{margin-top:8px}
.prev img{max-width:160px;max-height:160px;border-radius:14px;display:block;margin-bottom:6px}
#hsum{color:var(--mute);font-size:13px;background:#f6faff;border-radius:12px;padding:8px 14px;display:inline-block}
#hsum b{color:var(--dark);font-weight:600}
@media(max-width:900px){
.side{left:0;top:0;bottom:0;border-radius:0 24px 24px 0;transform:translateX(-105%);transition:.2s}
.side.open{transform:none;box-shadow:0 0 40px rgba(80,50,60,.2)}
.top{display:flex}
main{margin-left:0;padding:20px 14px 60px}
.box{padding:18px 16px;border-radius:20px}
.two{grid-template-columns:1fr}
.f{min-width:100%}
.row .btn{width:100%}
}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand" id="brand" onclick="shopForm()"></div>
  <nav class="nav" id="nav"></nav>
  <div class="nav set"><button onclick="shopForm()">ตั้งค่าร้าน</button></div>
</aside>
<div class="top"><b id="topTitle">Dashboard ภาพรวม</b><button class="btn o s" onclick="toggleSide()">เมนู</button></div>
<main id="main"></main>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ---------- ค่าคงที่ ---------- */
var KEY='ie_tracker_cache_v2';
var CH={chat:'ขายผ่านแชท',web:'ขายผ่านเว็บไซต์'};
var EXPC=['ค่าสมัครสมาชิกแอปพรีเมี่ยม','ค่าบัญชีและค่าบริการ','ค่าโฆษณาและการตลาด','ค่าธรรมเนียมธุรกรรม','ค่าใช้จ่ายอื่น ๆ'];
var INCC=['รายได้จากการขายแอปพรีเมี่ยม','รายรับอื่น ๆ'];
var MENU=[['dash','Dashboard ภาพรวม'],['chat','ระบบขายผ่านแชท'],['web','ระบบขายผ่านเว็บไซต์'],['form','บันทึกรายรับ-รายจ่าย'],['hist','ประวัติรายการ'],['exp','ส่งออกเอกสาร']];

/* ---------- ตัวช่วย ---------- */
function uid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)})}
function today(){return new Date().toLocaleDateString('sv-SE')}
function iso(back){var d=new Date();d.setDate(d.getDate()-back);return d.toLocaleDateString('sv-SE')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dth(s){if(!s)return '-';var p=s.split('-');return p[2]+'/'+p[1]+'/'+(+p[0]+543)}
function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},2600)}

/* ---------- ข้อมูล ---------- */
var S;
var SB={url:'https://vwgysbjieksxkramurfp.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3Z3lzYmppZWtzeGtyYW11cmZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MDIwNzMsImV4cCI6MjExMDM3ODA3M30.c5WRrjgYDYXW7TvsAG-_gW-DKXuMOBf6zSbWs69HxgI',owner:'fadf6bf6-37d3-45f8-b5ba-7ed0733d1de9'};
function fixS(){if(!S.shop)S.shop={name:'',logo:''}}
function cache(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fail(e){console.error(e);toast('ดำเนินการไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตและการตั้งค่า Supabase')}
function api(method,path,body,hdr){
  var h={apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json',Prefer:'return=minimal'};
  if(hdr)for(var k in hdr)h[k]=hdr[k];
  return fetch(SB.url+'/rest/v1/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t)});
    return r.text().then(function(t){return t?JSON.parse(t):null});
  });
}
function getAll(path){
  var out=[];
  function pg(o){return api('GET',path+'&limit=1000&offset='+o).then(function(r){r=r||[];out=out.concat(r);return r.length===1000?pg(o+1000):out})}
  return pg(0);
}
function fromAcc(r){return{id:r.id,ch:r.channel,name:r.name,open:Number(r.opening_balance)}}
function fromTx(r){return{id:r.id,date:r.tx_date,type:r.type,name:r.name,cat:r.category,amt:Number(r.amount),note:r.note||'',ch:r.channel,acc:r.account_id,hasImg:!!r.has_image}}
function pull(){
  return Promise.all([
    api('GET','shop_settings?select=name,logo'),
    getAll('accounts?select=*&order=created_at.asc,id.asc'),
    getAll('transactions?select=id,tx_date,type,name,category,amount,note,channel,account_id,has_image&order=tx_date.desc,created_at.desc,id.asc')
  ]).then(function(r){
    var sh=(r[0]&&r[0][0])||{};
    S={shop:{name:sh.name||'',logo:sh.logo||''},acc:r[1].map(fromAcc),tx:r[2].map(fromTx)};
    cache();
  });
}
function init(){
  S={shop:{name:'',logo:''},acc:[],tx:[]};
  try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);fixS()}}catch(e){}
  render();
  pull().then(function(){if(view!=='form'&&!$('modalRoot').innerHTML)render();else drawBrand()}).catch(function(e){console.error(e);toast('เชื่อมต่อ Supabase ไม่สำเร็จ กำลังแสดงข้อมูลที่เก็บไว้ในเครื่อง')});
}
function sum(list){var i=0,e=0;list.forEach(function(t){if(t.type==='inc')i+=+t.amt;else e+=+t.amt});return{inc:i,exp:e,net:i-e}}
function accBal(a){var s=sum(S.tx.filter(function(t){return t.acc===a.id}));return{inc:s.inc,exp:s.exp,bal:(+a.open||0)+s.net}}
function chBal(ch){return S.acc.filter(function(a){return a.ch===ch}).reduce(function(x,a){return x+accBal(a).bal},0)}
function accName(id){var a=S.acc.find(function(x){return x.id===id});return a?a.name:'-'}
function inPeriod(t,p,v){return p==='all'||!v||t.date.indexOf(v)===0}

/* ---------- สถานะหน้า ---------- */
var view='dash',editId=null,preset='chat',formImg='',imgTouched=false;
var D={scope:'all',p:'month',v:today().slice(0,7)};
var H={q:'',from:'',to:'',type:'',cat:'',ch:''};
var E={ch:'all',from:'',to:''};

function toggleSide(){$('side').classList.toggle('open')}
function go(v,id,ch){view=v;if(v==='form'){editId=id||null;if(ch)preset=ch;formImg='';imgTouched=false;if(id){var t=S.tx.find(function(x){return x.id===id});if(t&&t.hasImg){api('GET','transactions?id=eq.'+id+'&select=image').then(function(r){if(editId===id&&r&&r[0]){formImg=r[0].image||'';if(view==='form'&&$('prev'))showPrev()}}).catch(function(){})}}}
  $('side').classList.remove('open');render();window.scrollTo(0,0)}
function drawBrand(){
  var sh=S.shop;
  $('brand').innerHTML=(sh.logo?'<img class="lg" src="'+sh.logo+'">':'<div class="lg"></div>')+esc(sh.name||'ระบบรายรับ-รายจ่าย')+'<small>'+(sh.name?'ระบบรายรับ-รายจ่าย':'ธุรกิจขายแอปพรีเมี่ยม')+'</small>';
  document.title=sh.name||'ระบบบันทึกรายรับ-รายจ่าย';
}
var tmpLogo='';
function shopForm(){
  tmpLogo=S.shop.logo||'';
  $('side').classList.remove('open');
  modal('<h3>ตั้งค่าร้าน</h3><div class="f"><label>ชื่อร้าน</label><input id="sn" value="'+esc(S.shop.name)+'" placeholder="เช่น ร้านแอปพรีเมี่ยม"></div><div class="f"><label>โลโก้ร้าน (เลือกจากเครื่อง)</label><input id="sl" type="file" accept="image/*" onchange="pickLogo(this)"><div class="prev" id="lprev"></div></div><div class="acts"><button class="btn o" onclick="closeM()">ยกเลิก</button><button class="btn" onclick="saveShop()">บันทึก</button></div>');
  showLogo();setTimeout(function(){$('sn').focus()},50);
}
function showLogo(){
  $('lprev').innerHTML=tmpLogo?'<img src="'+tmpLogo+'" style="max-width:120px;max-height:120px"><span style="font-size:12px;color:var(--mute)">ขนาดหลังบีบอัด ~'+Math.round(tmpLogo.length*0.75/1024)+' KB</span> <button class="btn d s" type="button" onclick="tmpLogo=\'\';$(\'sl\').value=\'\';showLogo()">ลบโลโก้</button>':'';
}
function pickLogo(inp){
  var f=inp.files[0];if(!f)return;
  if(f.type.indexOf('image/')!==0){toast('กรุณาเลือกไฟล์รูปภาพ');inp.value='';return}
  var r=new FileReader();
  r.onload=function(e){
    var im=new Image();
    im.onload=function(){
      var k=Math.min(1,256/Math.max(im.width,im.height));
      var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      tmpLogo=c.toDataURL('image/webp',0.85);showLogo();
    };
    im.onerror=function(){toast('เปิดรูปภาพไม่ได้')};
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}
function saveShop(){
  var sh={name:$('sn').value.trim(),logo:tmpLogo};
  api('POST','shop_settings?on_conflict=owner_id',{owner_id:SB.owner,name:sh.name,logo:sh.logo},{Prefer:'resolution=merge-duplicates,return=minimal'}).then(function(){
    S.shop=sh;cache();closeM();toast('บันทึกข้อมูลร้านแล้ว');render();
  }).catch(fail);
}
function render(){
  drawBrand();
  $('nav').innerHTML=MENU.map(function(m){return '<button class="'+(view===m[0]?'on':'')+'" onclick="go(\''+m[0]+'\')">'+m[1]+'</button>'}).join('');
  $('topTitle').textContent=(MENU.find(function(m){return m[0]===view})||[])[1];
  var f={dash:rDash,chat:function(){rChan('chat')},web:function(){rChan('web')},form:rForm,hist:rHist,exp:rExp}[view];
  f();
}

/* ---------- Modal ---------- */
function modal(h){$('modalRoot').innerHTML='<div class="ov" onclick="if(event.target===this)closeM()"><div class="md">'+h+'</div></div>'}
function closeM(){$('modalRoot').innerHTML=''}
var cfCb=null;
function confirmBox(msg,cb){cfCb=cb;modal('<h3>ยืนยันการดำเนินการ</h3><p>'+msg+'</p><div class="acts"><button class="btn o" onclick="closeM()">ยกเลิก</button><button class="btn" onclick="var c=cfCb;closeM();c&&c()">ยืนยัน</button></div>')}
function viewImg(id){api('GET','transactions?id=eq.'+id+'&select=image').then(function(r){var im=r&&r[0]&&r[0].image;if(im)modal('<img src="'+im+'" style="width:100%;border-radius:12px"><div class="acts"><button class="btn o" onclick="closeM()">ปิด</button></div>');else toast('ไม่พบรูปภาพ')}).catch(fail)}

/* ---------- Dashboard ---------- */
function setDash(k,val){D[k]=val;
  if(k==='p'){D.v=val==='day'?today():val==='month'?today().slice(0,7):val==='year'?today().slice(0,4):''}
  rDash()}
function rDash(){
  var L=S.tx.filter(function(t){return(D.scope==='all'||t.ch===D.scope)&&inPeriod(t,D.p,D.v)});
  var s=sum(L);
  var bal=D.scope==='all'?chBal('chat')+chBal('web'):chBal(D.scope);
  var inp=D.p==='day'?'<input type="date" value="'+D.v+'" onchange="setDash(\'v\',this.value)">':D.p==='month'?'<input type="month" value="'+D.v+'" onchange="setDash(\'v\',this.value)">':D.p==='year'?'<input type="number" min="2000" max="2100" value="'+D.v+'" onchange="setDash(\'v\',this.value)">':'<input disabled value="ทั้งหมด">';
  var chs=D.scope==='all'?['chat','web']:[D.scope];
  var chRows=chs.map(function(c){var x=sum(L.filter(function(t){return t.ch===c}));
    return '<tr><td>'+CH[c]+'</td><td class="r inc">'+money(x.inc)+'</td><td class="r exp">'+money(x.exp)+'</td><td class="r">'+money(x.net)+'</td><td class="r">'+money(chBal(c))+'</td></tr>'}).join('');
  var cats=INCC.concat(EXPC);
  var catRows=cats.map(function(c){var x=sum(L.filter(function(t){return t.cat===c}));
    if(!x.inc&&!x.exp)return '';
    return '<tr><td>'+esc(c)+'</td><td class="r inc">'+money(x.inc)+'</td><td class="r exp">'+money(x.exp)+'</td></tr>'}).join('')||'<tr><td colspan="3" class="empty">ไม่มีข้อมูลในช่วงเวลานี้</td></tr>';
  $('main').innerHTML='<h1>Dashboard ภาพรวม</h1><p class="sub">สรุปข้อมูลทางการเงินตามช่องทางและช่วงเวลาที่เลือก</p>'+
  '<div class="row"><div class="f"><label>ระบบ</label><select onchange="setDash(\'scope\',this.value)"><option value="all"'+(D.scope==='all'?' selected':'')+'>ภาพรวมทั้งหมด</option><option value="chat"'+(D.scope==='chat'?' selected':'')+'>ขายผ่านแชท</option><option value="web"'+(D.scope==='web'?' selected':'')+'>ขายผ่านเว็บไซต์</option></select></div>'+

function accForm(id,ch){

  setTimeout(function(){$('an').focus()},50);
}
function saveAcc(id,ch){
  var n=$('an').value.trim(),o=parseFloat($('ao').value)||0;
  if(!n){toast('กรุณากรอกชื่อบัญชี');return}
  var nid=id||uid();
  var p=id?api('PATCH','accounts?id=eq.'+id,{name:n,opening_balance:o}):api('POST','accounts',{id:nid,channel:ch,name:n,opening_balance:o});
  p.then(function(){
    if(id){var a=S.acc.find(function(x){return x.id===id});a.name=n;a.open=o}else S.acc.push({id:nid,ch:ch,name:n,open:o});
    cache();closeM();toast('บันทึกบัญชีแล้ว');render();
  }).catch(fail);
}
function delAcc(id){
  if(S.tx.some(function(t){return t.acc===id})){toast('ไม่สามารถลบได้ เพราะบัญชีนี้มีรายการอยู่');return}
  confirmBox('ต้องการลบบัญชีนี้ใช่หรือไม่',function(){
    api('DELETE','accounts?id=eq.'+id).then(function(){S.acc=S.acc.filter(function(a){return a.id!==id});cache();toast('ลบบัญชีแล้ว');render()}).catch(fail);
  });
}
function delTx(id){
  var t=S.tx.find(function(x){return x.id===id});
  confirmBox('ต้องการลบรายการ "'+esc(t.name)+'" จำนวน '+money(t.amt)+' บาท ใช่หรือไม่ การลบไม่สามารถย้อนกลับได้',function(){
    api('DELETE','transactions?id=eq.'+id).then(function(){S.tx=S.tx.filter(function(x){return x.id!==id});cache();toast('ลบรายการแล้ว');render()}).catch(fail);
  });
}

function fillCat(sel){
  var L=$('ft').value==='inc'?INCC:EXPC;
  $('fg').innerHTML=L.map(function(c){return '<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'}).join('');
}
function fillAcc(sel){
  var L=S.acc.filter(function(a){return a.ch===$('fc').value});
  $('fa').innerHTML=L.length?L.map(function(a){return '<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(a.name)+'</option>'}).join(''):'<option value="">ยังไม่มีบัญชี (เพิ่มได้ในหน้าระบบของช่องทางนั้น)</option>';
}
function showPrev(){
  $('prev').innerHTML=formImg?'<img src="'+formImg+'"><span style="font-size:12px;color:var(--mute)">ขนาดหลังบีบอัด ~'+Math.round(formImg.length*0.75/1024)+' KB</span> <button class="btn d s" type="button" onclick="imgTouched=true;formImg=\'\';$(\'fi\').value=\'\';showPrev()">ลบรูป</button>':'';
}
function pickImg(inp){
  var f=inp.files[0];if(!f)return;
  if(f.type.indexOf('image/')!==0){toast('กรุณาเลือกไฟล์รูปภาพ');inp.value='';return}
  var r=new FileReader();
  r.onload=function(e){
    var im=new Image();
    im.onload=function(){
      var M=800,w=im.width,h=im.height,k=Math.min(1,M/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      formImg=c.toDataURL('image/jpeg',0.7);imgTouched=true;showPrev();
    };
    im.onerror=function(){toast('เปิดรูปภาพไม่ได้')};
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}
function saveTx(){
  var o={date:$('fd').value,type:$('ft').value,ch:$('fc').value,acc:$('fa').value,name:$('fn').value.trim(),cat:$('fg').value,amt:parseFloat($('fm').value),note:$('fo').value.trim()};
  if(!o.date){toast('กรุณาเลือกวันที่');return}
  if(!o.name){toast('กรุณากรอกชื่อรายการ');return}
  if(!o.acc){toast('กรุณาเลือกบัญชี หากไม่มีให้เพิ่มบัญชีก่อน');return}
  if(!(o.amt>0)){toast('กรุณากรอกจำนวนเงินมากกว่า 0');return}
  var row={tx_date:o.date,type:o.type,name:o.name,category:o.cat,amount:o.amt,note:o.note,channel:o.ch,account_id:o.acc};
  var wasEdit=editId,img=formImg,touched=imgTouched,p;
  if(wasEdit){if(touched)row.image=img;p=api('PATCH','transactions?id=eq.'+wasEdit,row)}
  else{o.id=uid();row.id=o.id;row.image=img;p=api('POST','transactions',row)}
  p.then(function(){
    if(wasEdit){var t=S.tx.find(function(x){return x.id===wasEdit});Object.assign(t,o);if(touched)t.hasImg=!!img}
    else{o.hasImg=!!img;S.tx.push(o)}
    cache();toast(wasEdit?'แก้ไขรายการแล้ว':'บันทึกรายการแล้ว');editId=null;formImg='';imgTouched=false;preset=o.ch;go('hist');
  }).catch(fail);
}

  '<div class="f"><label>ถึงวันที่</label><input type="date" value="'+E.to+'" onchange="setE(\'to\',this.value)"></div></div>'+
  '<p id="epv"></p><div class="acts" style="justify-content:flex-start"><button class="btn" onclick="expPDF()">ส่งออก PDF</button><button class="btn o" onclick="expXLS()">ส่งออก Excel</button></div>'+
  '<p class="sub" style="margin:14px 0 0;font-size:13px">การส่งออก PDF จะเปิดหน้าต่างพิมพ์ ให้เลือก "บันทึกเป็น PDF" ที่ปลายทาง</p></div>';
  drawExp();
}
function groupSum(L){
  var o=[];
  ['chat','web'].forEach(function(c){var x=sum(L.filter(function(t){return t.ch===c}));if(E.ch==='all'||E.ch===c)o.push([CH[c],x.inc,x.exp,x.net])});
  return o;
}
function expPDF(){
  var L=expRows();if(!L.length){toast('ไม่มีรายการให้ส่งออกในตัวกรองที่เลือก');return}
  var s=sum(L),i=expInfo();
  var gs=groupSum(L).map(function(g){return '<tr><td>'+g[0]+'</td><td class="r">'+money(g[1])+'</td><td class="r">'+money(g[2])+'</td><td class="r">'+money(g[3])+'</td></tr>'}).join('');
  var rows=L.map(function(t,n){return '<tr><td>'+(n+1)+'</td><td>'+dth(t.date)+'</td><td>'+esc(t.name)+'</td><td>'+esc(t.cat)+'</td><td>'+(t.type==='inc'?'รายรับ':'รายจ่าย')+'</td><td class="r">'+money(t.amt)+'</td><td>'+CH[t.ch]+'<br>'+esc(accName(t.acc))+'</td><td>'+esc(t.note)+'</td></tr>'}).join('');
  var h='<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>รายงานรายรับ-รายจ่าย</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet"><style>body{font-family:Sarabun,Tahoma,sans-serif;color:#111;font-size:12px;margin:24px}h1{font-size:20px;margin:0 0 4px}p{margin:2px 0;color:#444}table{width:100%;border-collapse:collapse;margin:14px 0}th,td{border:1px solid #ccc;padding:5px 7px;text-align:left;vertical-align:top}th{background:#f1f1f1}.r{text-align:right}h2{font-size:14px;margin:18px 0 0}.t td{font-weight:600;background:#fafafa}@page{margin:14mm}</style></head><body>'+
  '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">'+(S.shop.logo?'<img src="'+S.shop.logo+'" style="height:52px">':'')+'<div>'+(S.shop.name?'<b style="font-size:16px">'+esc(S.shop.name)+'</b>':'')+'<h1>รายงานรายรับ-รายจ่าย</h1></div></div><p>ขอบเขตข้อมูล: '+i.chn+'</p><p>ช่วงเวลา: '+i.per+'</p><p>วันที่ออกเอกสาร: '+i.now+'</p>'+
  '<h2>สรุปยอด</h2><table><thead><tr><th>รายการสรุป</th><th class="r">รายรับ</th><th class="r">รายจ่าย</th><th class="r">สุทธิ</th></tr></thead><tbody>'+gs+'<tr class="t"><td>รวม</td><td class="r">'+money(s.inc)+'</td><td class="r">'+money(s.exp)+'</td><td class="r">'+money(s.net)+'</td></tr></tbody></table>'+
  '<h2>รายการทั้งหมด ('+L.length+' รายการ)</h2><table><thead><tr><th>#</th><th>วันที่</th><th>รายการ</th><th>หมวดหมู่</th><th>ประเภท</th><th class="r">จำนวนเงิน</th><th>ช่องทาง / บัญชี</th><th>หมายเหตุ</th></tr></thead><tbody>'+rows+'</tbody></table></body></html>';
  var f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  var d=f.contentWindow.document;d.open();d.write(h);d.close();
  setTimeout(function(){f.contentWindow.focus();f.contentWindow.print();setTimeout(function(){f.remove()},3000)},700);
}
function expXLS(){
  var L=expRows();if(!L.length){toast('ไม่มีรายการให้ส่งออกในตัวกรองที่เลือก');return}
  if(typeof XLSX==='undefined'){toast('โหลดไลบรารี Excel ไม่สำเร็จ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่');return}
  var s=sum(L),i=expInfo();
  var a=[[S.shop.name||'ร้าน (ยังไม่ระบุชื่อ)'],['รายงานรายรับ-รายจ่าย'],['ขอบเขตข้อมูล',i.chn],['ช่วงเวลา',i.per],['วันที่ออกเอกสาร',i.now],[],['รายการสรุป','รายรับ','รายจ่าย','สุทธิ']];
  groupSum(L).forEach(function(g){a.push(g)});
  a.push(['รวม',s.inc,s.exp,s.net]);
  var b=[['วันที่','รายการ','หมวดหมู่','ประเภท','จำนวนเงิน','ช่องทาง','บัญชี','หมายเหตุ']];
  L.forEach(function(t){b.push([dth(t.date),t.name,t.cat,t.type==='inc'?'รายรับ':'รายจ่าย',+t.amt,CH[t.ch],accName(t.acc),t.note])});
  var w1=XLSX.utils.aoa_to_sheet(a),w2=XLSX.utils.aoa_to_sheet(b);
  w1['!cols']=[{wch:28},{wch:26},{wch:16},{wch:16}];
  w2['!cols']=[{wch:12},{wch:30},{wch:30},{wch:10},{wch:14},{wch:18},{wch:28},{wch:30}];
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,w1,'สรุปยอด');XLSX.utils.book_append_sheet(wb,w2,'รายการ');
  XLSX.writeFile(wb,'รายรับรายจ่าย_'+(E.ch==='all'?'ภาพรวม':E.ch)+'_'+today()+'.xlsx');
  toast('ส่งออก Excel แล้ว');
}

/* ---------- เริ่มต้น ---------- */
init();
</script>
